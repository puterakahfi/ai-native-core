workflow_contract:
  id: product-development
  type: workflow
  version: "0.2.0"
  category: product-management
  purpose: >
    Defines the end-to-end AI-native workflow for developing a digital product
    from initial idea through discovery, PRD, MVP planning, technical spec,
    implementation, evidence-backed acceptance, release, deployment, launch,
    and post-launch learning. Runtime adapters provide concrete storage, task
    tracking, preview, deployment, analytics, and approval mechanisms.

  required_phases:
    - id: discovery
      order: 1
      description: Understand users, jobs, pains, alternatives, product opportunities, business value, and experiment needs
      gate: opportunity_and_business_value_must_be_explicit_before_prd
      skills:
        required: [user-research, business-value-alignment, experiment-design, product-manager]
        optional: [model-selection, decision-making]

    - id: requirements
      order: 2
      description: Author a PRD with value, goals, non-goals, metrics, scope, requirements, acceptance criteria, and launch criteria
      gate: prd_must_be_ready_before_mvp_or_spec
      skills:
        required: [product-requirements]
        optional: [business-value-alignment, product-manager]

    - id: mvp_slice
      order: 3
      description: Select the smallest release slice or experiment that validates the product opportunity and success metric
      gate: mvp_scope_must_be_explicit_before_technical_spec
      skills:
        required: [business-value-alignment, experiment-design, product-manager, decision-making]
        optional: [spike]

    - id: technical_spec
      order: 4
      description: Translate the approved PRD and MVP slice into technical specification, architecture constraints, tasks, and evidence plans
      gate: technical_spec_must_trace_to_prd
      skills:
        required: [spec-workflow, native-ai-engineer, master-engineer]
        optional: [api-contract, domain-driven-design, data-modeling, diagram-architect]

    - id: implementation
      order: 5
      description: Implement the MVP through new-feature-workflow with tests, design-decision boundaries, verification evidence, and scope control
      gate: implementation_must_trace_to_acceptance_criteria
      skills:
        required: [new-feature-workflow, test-driven-development, master-engineer]
        optional: [systematic-debugging, refactoring]

    - id: acceptance_verification
      order: 6
      description: Reconcile every PRD acceptance criterion with direct evidence, affected-domain reviewers, coverage, and explicit verdicts before release
      gate: acceptance_matrix_must_be_complete_before_release
      skills:
        required: [skill-eval, code-review-workflow]
        optional: [design-review, security-review, threat-modeling, web-performance, accessibility]

    - id: release
      order: 7
      description: Prepare release artifacts only after acceptance verification declares the MVP release-eligible
      gate: release_requires_release_ready_acceptance_and_rollback_artifacts
      skills:
        required: [git-workflow]
        optional: [deployment-workflow]

    - id: deploy
      order: 8
      description: Deploy through the product-defined mechanism and verify health before launch
      gate: deployment_health_must_be_verified
      skills:
        required: [deployment-workflow, observability-design]
        optional: [resilience-engineering, incident-response]

    - id: launch
      order: 9
      description: Launch to users with messaging, support, analytics, monitoring, and a feedback channel
      gate: launch_must_include_monitoring_and_feedback_loop
      skills:
        required: [business-value-alignment, product-manager, content-strategy]
        optional: [copywriting, cro, observability-design]

    - id: learn
      order: 10
      description: Review metrics, feedback, incidents, and decide whether to iterate, pivot, narrow, or stop
      gate: post_launch_learning_must_feed_next_prd_or_backlog
      skills:
        required: [business-value-alignment, product-manager, observability-design]
        optional: [user-research, incident-response, decision-making]

  skill_load_order:
    - phase: discovery
      load: [model-selection, user-research, business-value-alignment, experiment-design, product-manager, decision-making]
    - phase: requirements
      load: [product-requirements, business-value-alignment, product-manager]
    - phase: mvp_slice
      load: [business-value-alignment, experiment-design, product-manager, decision-making, spike]
    - phase: technical_spec
      load: [spec-workflow, native-ai-engineer, master-engineer, api-contract, data-modeling]
    - phase: implementation
      load: [new-feature-workflow, test-driven-development, master-engineer, systematic-debugging]
    - phase: acceptance_verification
      load: [skill-eval, code-review-workflow]
    - phase: acceptance_domain_review
      load: [design-review, security-review, threat-modeling, web-performance, accessibility]
    - phase: release
      load: [git-workflow, deployment-workflow]
    - phase: deploy
      load: [deployment-workflow, observability-design, resilience-engineering]
    - phase: launch
      load: [business-value-alignment, product-manager, content-strategy, copywriting, cro, observability-design]
    - phase: learn
      load: [business-value-alignment, product-manager, observability-design, user-research, decision-making]

  acceptance_matrix_contract:
    required_fields:
      - criterion_id
      - criterion
      - affected_domains
      - evidence_required
      - evidence_available
      - evidence_gaps
      - governing_reviewers
      - reviewer_verdicts
      - status
      - release_blocking
      - accepted_risk
    statuses:
      PASS: criterion_is_directly_verified
      CONDITIONAL: verified_scope_passes_but_explicit_non_blocking_risk_remains
      FAIL: direct_evidence_proves_the_criterion_is_not_satisfied
      NOT_VERIFIED: required_evidence_is_missing_or_insufficient
      NOT_APPLICABLE: criterion_or_domain_does_not_apply_to_the_mvp_slice
    rules:
      - every_in_scope_prd_acceptance_criterion_must_have_one_matrix_row
      - evidence_must_be_direct_and_appropriate_to_the_criterion
      - tests_builds_screenshots_and_checklists_only_prove_the_scope_they_directly_observe
      - not_verified_is_a_release_blocker_unless_the_criterion_is_formally_removed_from_scope
      - accepted_risk_cannot_override_a_failed_hard_gate_or_missing_primary_domain_reviewer
      - duplicate_evidence_may_support_multiple_rows_but_each_row_keeps_its_own_status

  design_acceptance_contract:
    trigger_when:
      - user_facing_appearance_interaction_state_content_or_accessibility_changes
      - responsive_or_adaptive_behavior_changes
      - generated_or_exported_visual_artifacts_are_part_of_the_mvp
    required_route_fields:
      - design_domain
      - surface_profile
      - artifact_state
      - review_depth
      - coverage_mode
      - domain_reviewers
      - evidence_available
      - evidence_gaps
    verdict_mapping:
      PASS: criterion_may_pass_when_other_evidence_also_passes
      CONDITIONAL_PASS: criterion_may_be_conditional_only_for_explicit_non_blocking_risk
      NEEDS_WORK: affected_criteria_fail_and_release_is_blocked
      CRITICAL: acceptance_and_release_are_blocked
      LIMITED_REVIEW: complete_primary_domain_acceptance_is_blocked
      ROUTE_ELSEWHERE: acceptance_is_blocked_until_the_required_reviewer_is_available

  code_review_contract:
    required_input:
      - approved_prd_and_mvp_scope
      - technical_spec
      - implementation_diff
      - test_and_runtime_evidence
      - applicable_design_security_performance_and_accessibility_evidence
      - known_limitations_and_accepted_risks
    verdict_mapping:
      APPROVED: implementation_review_requirement_passes
      REQUEST_CHANGES: affected_acceptance_rows_remain_fail_or_not_verified
      BLOCKED: hard_failure_reviewer_gap_or_required_evidence_prevents_review

  release_eligibility:
    RELEASE_READY:
      - every_in_scope_acceptance_criterion_is_PASS_or_permitted_CONDITIONAL
      - no_release_blocking_FAIL_or_NOT_VERIFIED_row_remains
      - code_review_workflow_verdict_is_APPROVED
      - all_applicable_hard_gates_pass
      - primary_domain_coverage_is_complete_for_required_design_claims
      - security_performance_accessibility_and_operational_requirements_have_direct_evidence_when_applicable
      - accepted_risks_are_explicit_non_blocking_owned_and_time_bounded
    NOT_READY:
      - any_in_scope_criterion_is_FAIL_or_release_blocking_NOT_VERIFIED
      - code_review_workflow_is_REQUEST_CHANGES_or_BLOCKED
      - design_review_is_NEEDS_WORK_CRITICAL_LIMITED_REVIEW_or_ROUTE_ELSEWHERE_for_required_scope
      - an_applicable_hard_gate_fails
      - required_reviewer_or_evidence_is_missing
    rule: release_artifacts_do_not_convert_NOT_READY_into_RELEASE_READY

  quality_gates:
    - no_technical_spec_before_prd_readiness
    - opportunity_and_business_value_must_be_explicit_before_prd
    - prd_must_have_user_value_business_value_goals_non_goals_metrics_scope_and_acceptance_criteria
    - experiment_first_verdict_must_produce_experiment_design_before_prd_or_build
    - mvp_scope_must_be_explicit_smaller_than_full_product_and_value_aligned
    - technical_spec_must_trace_to_prd_requirements
    - every_task_must_trace_to_acceptance_criteria
    - implementation_must_use_new_feature_workflow_boundaries
    - every_in_scope_acceptance_criterion_must_have_direct_evidence_and_a_matrix_status
    - changed_user_facing_output_requires_facade_backed_design_acceptance
    - code_review_workflow_approval_is_required_before_release
    - no_release_when_required_evidence_or_primary_domain_coverage_is_missing
    - release_must_have_notes_version_or_tag_and_rollback_plan
    - deployment_health_must_be_verified_before_launch
    - launch_must_define_support_analytics_and_feedback_loop
    - post_launch_learning_must_feed_next_prd_or_backlog

  stop_points:
    - after_discovery_recommendation
    - after_experiment_design
    - after_prd_draft
    - after_mvp_plan
    - after_technical_spec
    - before_release
    - after_post_launch_review

  adapter_requirements:
    product_artifact_storage: product_defined
    prd_format: product_defined
    task_tracker: product_defined
    repository_strategy: product_defined
    implementation_agent: product_defined
    verification_method: product_defined
    preview_and_runtime_method: product_defined
    release_method: product_defined
    deployment_provider: product_defined
    analytics_provider: product_defined
    launch_channel: product_defined
    approval_policy: product_defined
    accepted_risk_policy: product_defined