workflow_contract:
  id: new-feature
  type: workflow
  version: "0.3.0"
  category: engineering
  purpose: >
    Defines the required phases, evidence gates, and reviewer boundaries for a
    new feature workflow. Pre-implementation design approval decides what should
    be built; post-implementation acceptance proves the implemented result.
    Product adapters define branch strategy, spec format, issue tracking,
    preview/runtime production, and approval policy.

  required_phases:
    - id: plan
      order: 1
      description: Define user problem, scope, acceptance criteria, technical approach, and affected domains before implementation
      gate: spec_and_affected_domains_must_exist_before_implementation
      skills:
        required: [master-engineer]

    - id: design-decision
      order: 2
      description: Approve architecture, contracts, data, interaction, and visual decisions before implementation when affected
      gate: applicable_design_decisions_approved_before_implementation
      optional: true
      skills:
        required: [master-engineer]
        optional: [diagram-architect, master-design]

    - id: implement
      order: 3
      description: Implement the approved feature slice with tests and traceability to the spec and design decisions
      gate: implementation_must_trace_to_approved_scope
      skills:
        required: [master-engineer, test-driven-development]

    - id: verify
      order: 4
      description: Collect technical evidence and, when user-facing output changes, fresh rendered or exported design-acceptance evidence
      gate: acceptance_evidence_required_before_submission
      skills:
        optional: [design-review]

    - id: submit
      order: 5
      description: Submit the implementation with spec traceability, issue reference, and all required verification evidence
      gate: submission_must_reference_spec_issue_and_evidence
      skills:
        required: []

    - id: review
      order: 6
      description: Run evidence-backed code review and map architecture, design, logic, and security verdicts into the merge decision
      gate: code_review_approval_required_before_merge
      skills:
        required: [code-review-workflow]

  skill_load_order:
    - phase: plan
      load: [master-engineer]
    - phase: design-decision
      load: [master-engineer, diagram-architect, master-design]
    - phase: implement
      load: [master-engineer, test-driven-development]
    - phase: verify
      load: [design-review]
    - phase: review
      load: [code-review-workflow]

  design_lifecycle_contract:
    pre_implementation_decision:
      purpose:
        - decide the intended architecture, contracts, data model, task flow, component behavior, and visual direction
        - create implementation-ready acceptance criteria and design locks
      permitted_artifact_states:
        - specification
        - diagram
        - wireframe
        - prototype
        - source-only design contract
      required_outputs:
        - affected design domain and surface profile when user-facing
        - owner and relevant specialist decisions
        - required states, viewports, inputs, content, assets, and fidelity locks
        - explicit unresolved assumptions and approval boundary
      forbidden_claims:
        - implemented visual PASS
        - runtime PASS
        - accessibility PASS without implementation evidence
        - release-ready or production-ready claim

    post_implementation_acceptance:
      trigger_when:
        - rendered appearance can change
        - interaction, responsiveness, state behavior, accessibility, or user-facing content can change
        - generated or exported visual artifacts can change
      reviewer_facade: design-review
      required_route_fields:
        - design_domain
        - surface_profile
        - artifact_state
        - review_depth
        - coverage_mode
        - domain_reviewers
        - evidence_available
        - evidence_gaps
      evidence_policy:
        source_only:
          - source and implementation rules may be inspected
          - changed rendered behavior remains NOT_VERIFIED
          - source-only evidence cannot authorize submission as design-complete
        rendered_interactive:
          - changed viewports, themes, states, and expected inputs must be exercised
          - runtime and accessibility evidence are required when affected
        rendered_static:
          - final-size, crop, fidelity, content, and export evidence are required when affected
      verdict_to_submission:
        PASS: submission_eligible
        CONDITIONAL_PASS: submission_eligible_only_with_explicit_non_blocking_accepted_risks
        NEEDS_WORK: return_to_implementation
        CRITICAL: block_submission
        LIMITED_REVIEW: block_complete_domain_acceptance
        ROUTE_ELSEWHERE: block_until_required_reviewer_is_available

  review_contract:
    required_reviewer: code-review-workflow
    evidence_handoff:
      - feature spec and accepted scope
      - pre-implementation design decisions and locks
      - implementation diff
      - technical verification evidence
      - post-implementation design-review route, evidence, and verdict when applicable
      - known limitations and accepted risks
    merge_rule:
      - no merge without explicit code-review-workflow approval
      - design NEEDS WORK, CRITICAL, LIMITED REVIEW, or ROUTE ELSEWHERE cannot be downgraded to a non-blocking flag

  quality_gates:
    - spec_and_affected_domains_must_exist_before_implementation
    - pre_implementation_design_decision_must_not_claim_implemented_acceptance
    - implementation_must_not_exceed_approved_scope
    - tests_and_technical_verification_evidence_required
    - user_facing_changes_require_post_implementation_design_acceptance
    - changed_rendered_output_requires_fresh_rendered_or_exported_evidence
    - source_only_or_wireframe_evidence_cannot_prove_implemented_design_acceptance
    - limited_domain_coverage_cannot_approve_complete_specialist_design_claims
    - submission_must_reference_spec_issue_and_verification_evidence
    - code_review_workflow_approval_required_before_merge
    - no_unrelated_changes_bundled

  adapter_requirements:
    branch_strategy: product_defined
    base_branch: product_defined
    spec_format: product_defined
    issue_tracker: product_defined
    issue_reference_method: product_defined
    design_decision_required: product_defined
    preview_or_runtime_method: product_defined
    verification_method: product_defined
    approval_policy: product_defined
    ci_required: product_defined
