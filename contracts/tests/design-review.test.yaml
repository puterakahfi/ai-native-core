contract_schema:
  kind: behavioral_test_contract
  version: 1.0.0
  path: schemas/behavioral-test-contract.schema.yaml
skill_test:
  skill: design-review
  version: "0.2.0"
  description: Verify design-review enforces truthful continuation actions and rendered runtime integrity

  cases:
    - id: behavior-backed-continuation
      description: Continue and Resume labels must be backed by restorable state across different product contexts
      trigger: "Review these two interfaces: (A) a document editor shows 'Continue editing' after a document was only viewed, but no draft is stored; (B) a checkout dashboard shows 'Resume checkout' after a product page was viewed, but no cart or checkout step is stored. Are these labels valid?"
      must_contain:
        - "reconstructable"
        - "Recently viewed"
        - "Open again"
        - "draft"
        - "cart"
      must_not_contain:
        - "Both labels are valid"
        - "Keep Continue editing"
        - "Keep Resume checkout"
      quality_gates_tested:
        - status_and_action_honesty
        - continuation_requires_reconstructable_task_state

    - id: rendered-runtime-integrity
      description: A visually usable interface must fail review when executable assets receive HTML or produce unhandled page errors
      trigger: "Review these rendered interfaces: (A) an admin dashboard looks usable, but the browser reports an unhandled SyntaxError because an analytics script received an HTML document; (B) a storefront shell renders, but its lazy-loaded recommendation JavaScript receives a login HTML page. A separate framework prefetch request was cancelled without causing a page error or missing UI. Can these interfaces pass design review?"
      must_contain:
        - "REQUEST CHANGES"
        - "unhandled"
        - "HTML"
        - "executable"
        - "prefetch"
      must_not_contain:
        - "APPROVED"
        - "ignore the console"
        - "visual looks fine"
        - "cancelled prefetch is automatically a failure"
      quality_gates_tested:
        - rendered_runtime_integrity
        - executable_assets_must_not_receive_html
        - cancelled_prefetch_requires_user_visible_impact
