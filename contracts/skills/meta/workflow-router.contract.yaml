skill_contract:
  id: workflow-router
  type: meta-skill
  category: meta
  version: "0.2.0"
  capability: detect_task_type_and_route_to_correct_workflow_automatically
  roles:
    - workflow_dispatcher
    - intent_classifier
  inputs:
    required:
      - user_request
    optional:
      - context_pack
      - available_workflows
  outputs:
    allowed:
      - workflow_selection
      - skill_load_order
      - routing_rationale
      - ambiguity_resolution
  route_classes:
    - product_from_zero
    - ui_ux_refinement
    - new_feature
    - bugfix
    - code_review
    - deployment
    - spike_or_exploration
    - planning_or_spec
    - service_or_architecture_design
  route_targets:
    product_from_zero: product-development-workflow
    ui_ux_refinement: redesign-workflow
    new_feature: new-feature-workflow
    bugfix: bugfix-workflow
    code_review: code-review-workflow
    deployment: deployment-workflow
    planning_or_spec: spec-workflow
  quality_gates:
    - task_type_must_be_classified_before_workflow_selection
    - routing_decision_must_be_stated_explicitly
    - ambiguous_requests_must_be_clarified_not_assumed
    - selected_workflow_must_be_loaded_before_execution
    - no_execution_before_routing_confirmed
    - fallback_must_be_defined_when_no_workflow_matches
    - product_from_zero_requests_must_not_route_directly_to_implementation
    - existing_ui_refinement_requests_must_route_to_redesign_workflow_not_new_surface_workflows
  adapter_requirements:
    available_workflows: product_defined
    ambiguity_threshold: product_defined
    fallback_behavior: product_defined
