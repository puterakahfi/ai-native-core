contract_schema:
  kind: skill_contract
  version: 1.0.0
  path: schemas/skill-contract.schema.yaml
skill_contract:
  id: workflow-router
  type: meta-skill
  category: meta
  version: "0.2.1"
  capability: detect_task_type_and_route_to_correct_workflow_automatically
  roles:
    - workflow_dispatcher
    - intent_classifier

  inputs:
    required:
      - user_request
    optional:
      - context_pack
      - available_workflows
      - parent_workflow_state
      - verified_fix_evidence

  outputs:
    allowed:
      - workflow_selection
      - skill_load_order
      - routing_rationale
      - ambiguity_resolution
      - post_fix_learning_route

  route_classes:
    - product_from_zero
    - ui_ux_refinement
    - targeted_design_refinement
    - verified_case_skill_evolution
    - new_feature
    - bugfix
    - code_review
    - deployment
    - spike_or_exploration
    - planning_or_spec
    - service_or_architecture_design

  route_targets:
    product_from_zero: product-development-workflow
    ui_ux_refinement: redesign-workflow
    targeted_design_refinement: design-refinement
    verified_case_skill_evolution: skill-evolution
    new_feature: new-feature-workflow
    bugfix: bugfix-workflow
    code_review: code-review-workflow
    deployment: deployment-workflow
    planning_or_spec: spec-workflow

  internal_routes:
    post_verified_fix:
      target: skill-evolution
      requires:
        - verified_fix_evidence
        - candidate_skill_or_workflow
      load:
        - skill-evolution
        - skill-eval
      resume_parent_after: learning_promotion_verdict_recorded

  quality_gates:
    - task_type_must_be_classified_before_workflow_selection
    - routing_decision_must_be_stated_explicitly
    - ambiguous_requests_must_be_clarified_not_assumed
    - selected_workflow_must_be_loaded_before_execution
    - no_execution_before_routing_confirmed
    - fallback_must_be_defined_when_no_workflow_matches
    - product_from_zero_requests_must_not_route_directly_to_implementation
    - existing_ui_refinement_requests_must_route_to_redesign_workflow_not_new_surface_workflows
    - targeted_design_gate_fixes_must_route_to_design_refinement
    - explicit_verified_case_learning_requests_must_route_to_skill_evolution
    - parent_workflows_with_verified_fixes_must_route_to_skill_evolution_before_final_delivery
    - post_fix_learning_route_must_not_bypass_repository_write_or_approval_policy

  adapter_requirements:
    available_workflows: product_defined
    ambiguity_threshold: product_defined
    fallback_behavior: product_defined
    post_fix_learning_route_enabled: true
    repository_write_policy: product_defined
