contract_schema:
  kind: skill_contract
  version: 1.0.0
  path: schemas/skill-contract.schema.yaml
skill_contract:
  id: role-switcher
  type: meta-skill
  category: meta
  version: "0.1.0"
  capability: intent_detection_and_automatic_role_composition
  roles:
    - role_orchestrator
    - intent_classifier
  inputs:
    required:
      - user_request
    optional:
      - product_context
      - available_skills
  outputs:
    allowed:
      - detected_intent
      - role_composition
      - skills_to_load
      - analysis_with_multi_lens
  quality_gates:
    - intent_must_be_detected_before_role_selection
    - role_composition_must_be_explicit_not_implicit
    - each_role_must_contribute_a_distinct_lens
    - no_role_loaded_without_clear_relevance_to_intent
    - multi_role_output_must_be_structured_by_lens
    - agent_must_state_which_roles_were_activated
  adapter_requirements:
    role_map: product_defined
    intent_detection_strategy: product_defined
    max_concurrent_roles: product_defined
