contract_schema:
  kind: skill_contract
  version: 1.0.0
  path: schemas/skill-contract.schema.yaml
skill_contract:
  id: delivery-work-breakdown
  category: product
  type: skill
  version: "1.0.0"
  capability: release_unit_classification_work_hierarchy_and_branch_topology
  capability_aliases:
    - epic_feature_task_decomposition
    - delivery_release_topology
    - integration_branch_planning

  description: >
    Classifies the delivery release unit before repository work begins, decomposes
    verified scope into product, epic, feature, task, spike, and bug work items,
    traces every child item to parent acceptance criteria, and defines the branch
    base and pull-request target topology required to integrate and release the work
    safely. It does not replace product-defined issue trackers, branch names, merge
    policy, feature-flag implementation, or release authorization.

  roles:
    - delivery_planner
    - epic_owner
    - work_breakdown_specialist
    - release_topology_designer
    - integration_planner

  inputs:
    required:
      - delivery_intent_or_scope
      - acceptance_criteria
      - repository_and_release_context
    optional:
      - existing_prd_or_feature_spec
      - existing_issue_hierarchy
      - existing_branch_policy
      - release_branch
      - feature_flag_policy
      - dependency_constraints
      - deployment_constraints
      - independently_releasable_evidence
      - decision_provenance_records

  outputs:
    allowed:
      - release_unit_classification
      - release_unit_rationale
      - work_hierarchy
      - parent_child_traceability
      - dependency_graph
      - issue_plan
      - branch_topology
      - pr_target_matrix
      - integration_plan
      - epic_acceptance_plan
      - final_release_gate
      - topology_gap_report

  release_units:
    allowed:
      - standalone_change
      - feature
      - epic
      - product_release
    rules:
      - release_unit_is_classified_before_branch_creation_or_pr_submission
      - classification_uses_dependency_releasability_runtime_activation_and_acceptance_boundaries
      - work_item_size_or_file_count_alone_does_not_define_the_release_unit
      - one_delivery_intent_may_contain_multiple_work_item_types_but_has_one_governing_release_unit

  epic_classification:
    required_when_any:
      - multiple_dependent_slices_form_one_user_or_runtime_outcome
      - individual_slices_are_not_independently_releasable
      - end_to_end_acceptance_requires_combined_slices
      - partial_merge_would_expose_or_enable_an_incomplete_capability
      - one_release_decision_governs_multiple_feature_or_task_items
    may_be_avoided_when:
      - each_slice_is_independently_releasable_and_backward_compatible
      - an_approved_disabled_by_default_feature_flag_prevents_incomplete_activation
      - product_policy_explicitly_allows_trunk_based_incremental_integration_with_equivalent_gates
    rules:
      - avoiding_an_epic_requires_direct_releasability_or_feature_flag_evidence
      - a_documentation_only_or_inert_foundation_slice_may_be_independently_releasable_when_it_cannot_activate_incomplete_behavior

  work_hierarchy_contract:
    allowed_item_types:
      - product
      - epic
      - feature
      - task
      - spike
      - bug
    required_fields_per_item:
      - work_item_id
      - work_item_type
      - parent_ref
      - acceptance_criteria_refs
      - dependencies
      - independently_releasable
      - base_branch
      - pr_target
      - verification_scope
    rules:
      - every_non_root_item_has_one_explicit_parent
      - every_child_item_traces_to_at_least_one_parent_acceptance_criterion
      - tasks_do_not_float_without_a_feature_epic_or_release_parent
      - dependencies_are_directed_and_cycles_are_reported
      - spikes_produce_decisions_or_evidence_and_do_not_silently_become_production_slices
      - bugs_found_inside_an_epic_preserve_the_epic_release_boundary_unless_product_authority_reclassifies_them

  branch_topology_contract:
    required_fields:
      - release_branch
      - integration_branch_when_required
      - work_item_base_branch
      - work_item_pr_target
      - final_epic_pr_target
      - branch_naming_policy_ref
      - merge_policy_ref
    rules:
      - feature_or_task_branches_start_from_their_approved_integration_base
      - feature_or_task_prs_target_the_approved_integration_branch_when_an_epic_is_required
      - the_epic_branch_targets_the_release_branch_only_after_epic_acceptance
      - direct_to_release_branch_requires_independent_releasability_or_an_approved_safe_feature_flag
      - base_branch_and_pr_target_are_not_guessed_from_repository_defaults
      - shared_or_integration_branches_are_not_force_pushed
      - branch_topology_changes_require_updated_provenance_and_dependency_review

  pr_target_contract:
    decisions:
      epic_child:
        default_target: epic_or_integration_branch
        release_branch_target_allowed: false
      independently_releasable_feature:
        default_target: product_defined_release_or_integration_branch
        release_branch_target_allowed: true
      safely_flagged_increment:
        default_target: product_defined_release_or_integration_branch
        release_branch_target_allowed: true
        requires:
          - approved_feature_flag_policy
          - disabled_by_default_or_equivalent_safe_state
          - no_unflagged_incomplete_runtime_path
      final_epic:
        default_target: release_branch
        requires:
          - all_required_children_integrated
          - epic_acceptance_complete
          - release_authorization_routed
    rules:
      - mergeability_or_green_ci_alone_does_not_select_the_pr_target
      - a_child_pr_cannot_bypass_the_parent_release_unit
      - product_defined_trunk_based_delivery_may_replace_long_lived_epic_branches_only_with_equivalent_activation_and_acceptance_controls

  epic_acceptance_contract:
    required:
      - parent_acceptance_matrix
      - child_completion_and_evidence_map
      - integration_verification
      - end_to_end_runtime_or_product_evidence_when_applicable
      - unresolved_gap_report
      - final_release_eligibility
      - release_authorization_status
    rules:
      - child_ci_success_does_not_prove_epic_acceptance
      - every_parent_acceptance_criterion_has_direct_or_composed_evidence
      - unresolved_required_children_or_release_blocking_gaps_keep_the_epic_not_ready
      - final_epic_pr_is_opened_only_when_the_integration_branch_is_reviewable_as_one_release_unit
      - release_ready_does_not_self_authorize_merge_or_release

  quality_gates:
    - release_unit_must_be_classified_before_branch_creation
    - epic_required_for_dependent_non_independently_releasable_slices
    - every_child_work_item_must_trace_to_parent_acceptance_criteria
    - no_orphan_feature_task_spike_or_bug_items
    - dependency_graph_must_be_explicit_and_cycle_checked
    - base_branch_and_pr_target_must_be_explicit_per_work_item
    - epic_child_prs_must_target_the_epic_or_integration_branch
    - direct_to_release_branch_requires_independent_releasability_or_approved_safe_feature_flag
    - feature_flag_exception_requires_disabled_or_equivalent_safe_default_and_no_unflagged_path
    - green_ci_or_mergeability_does_not_override_release_topology
    - final_epic_pr_requires_integrated_end_to_end_acceptance
    - release_ready_state_does_not_self_authorize_merge_or_release
    - product_defined_repository_and_approval_policy_must_be_preserved

  boundary:
    covers:
      - release_unit_classification
      - product_epic_feature_task_spike_and_bug_hierarchy
      - parent_child_acceptance_traceability
      - delivery_dependency_graph
      - issue_plan_structure
      - integration_and_release_branch_topology
      - work_item_base_branch_and_pr_target_decisions
      - epic_acceptance_and_final_release_gate_planning
      - direct_to_release_branch_exception_reasoning
    does_not_cover:
      - product_value_or_prd_authoring
      - acceptance_criterion_definition
      - issue_tracker_api_execution
      - repository_branch_commit_or_pr_execution
      - feature_flag_implementation
      - code_implementation
      - technical_code_review
      - product_release_authorization
      - deployment_execution
    delegates_to:
      product_value_or_prd_authoring: product-manager_or_product-requirements
      acceptance_criterion_definition: product-manager_or_product-requirements
      issue_tracker_api_execution: product_adapter
      repository_branch_commit_or_pr_execution: git-workflow
      feature_flag_implementation: engineering_product_adapter
      code_implementation: new-feature-workflow
      technical_code_review: code-review-workflow
      product_release_authorization: product_defined_authority
      deployment_execution: deployment-workflow

  adapter_requirements:
    issue_tracker: product_defined
    release_branch: product_defined
    branch_naming_policy: product_defined
    integration_branch_policy: product_defined
    pull_request_policy: product_defined
    merge_strategy: product_defined
    feature_flag_policy: product_defined
    release_authority: product_defined
    adapter_must_preserve_release_unit_and_parent_child_traceability: true
    adapter_must_report_unknown_or_conflicting_repository_policy: true
