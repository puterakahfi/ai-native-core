contract_schema:
  kind: skill_contract
  version: 1.0.0
  path: schemas/skill-contract.schema.yaml
skill_contract:
  id: ethics-responsible-ai
  type: skill
  category: quality
  version: "0.1.0"
  capability: ethical_analysis_fairness_audit_and_responsible_ai_governance
  roles:
    - ethics_reviewer
    - responsible_ai_advocate
  inputs:
    required:
      - ai_feature_or_system
    optional:
      - affected_user_groups
      - data_sources
      - decision_stakes
  outputs:
    allowed:
      - ethics_audit_report
      - fairness_analysis
      - harm_assessment
      - transparency_recommendations
      - consent_and_governance_gaps
      - accountability_map
  quality_gates:
    - affected_groups_must_be_identified_before_launch
    - high_stakes_decisions_must_have_human_oversight
    - training_data_bias_must_be_audited
    - ai_involvement_must_be_disclosed_to_users
    - consent_must_be_explicit_for_data_used_in_ai
    - accountability_must_be_assigned_for_ai_errors
    - harm_must_be_assessed_not_assumed_negligible
    - power_asymmetry_must_be_acknowledged
  adapter_requirements:
    ethics_framework: product_defined
    fairness_metrics: product_defined
    disclosure_policy: product_defined
    oversight_process: product_defined
