skill_contract:
  id: design-refinement
  category: quality
  type: workflow
  version: "1.1.0"
  capability: targeted_design_gate_refinement_without_full_redesign
  purpose: >
    Defines the targeted design refinement lifecycle for improving specific failing
    UI/UX quality gates while preserving an already-correct design direction. Every
    verified fix must also pass through a learning-promotion review so reusable
    reasoning can improve shared skills without copying product-specific implementation
    history into them. Runtime adapters implement artifact access, browser tooling,
    patch mechanics, repository writes, and score calculation independently.

  roles:
    - design_lead
    - ux_reviewer
    - frontend_engineer
    - skill_maintainer
    - regression_evaluator

  inputs:
    required:
      - target_url_or_artifact
      - failing_gates
    optional:
      - prior_audit_report
      - preserve_gates
      - preserve_elements
      - max_iterations
      - output_mode
      - approval_mode
      - repository_write_policy

  outputs:
    allowed:
      - refinement_scope
      - targeted_patch_plan
      - refined_artifact
      - gate_score_delta_report
      - regression_check_report
      - learning_candidate_report
      - learning_promotion_report
      - skill_patch_log
      - regression_eval_result
      - promotion_commit
      - residual_gap_report

  required_phases:
    - id: load-audit-state
      order: 1
      description: Load prior audit/review state or run a quick critical-gate audit before fixing
      gate: failing_gates_must_be_known_before_patch
      skills:
        required: [design-audit, design-review]

    - id: declare-scope
      order: 2
      description: Declare exactly which gates will be fixed and which passing gates/elements must be preserved
      gate: scope_must_identify_fix_and_preserve_sets
      skills:
        required: [design-review]

    - id: classify-and-fix
      order: 3
      description: Identify the governing skill and defect class, then apply the smallest candidate fix to the correct local or shared layer
      gate: defect_class_and_target_layer_known_before_patch
      skills:
        required: [master-design]
        optional: [adaptive-component-design, accessibility, readability, responsiveness, motion-design, composition, visual-hierarchy, ui-components]

    - id: targeted-verify
      order: 4
      description: Re-score fixed gates and adjacent/preserved gates to prove improvement without regression
      gate: fixed_gates_and_preserve_set_must_be_rechecked
      skills:
        required: [design-review]

    - id: learning-promotion
      order: 5
      description: Review every verified fix for reusable reasoning, generalize it, deduplicate it, add regression evidence, and promote only when all gates pass
      gate: verified_fixes_require_skill_evolution_verdict
      skills:
        required: [skill-evolution, skill-eval]

    - id: deliver
      order: 6
      description: Deliver score deltas, local changes, learning verdicts, promotions, commits, and residual gaps
      gate: delta_and_learning_reports_required_before_completion
      skills:
        required: []

  skill_load_order:
    - phase: load-audit-state
      load: [design-audit, design-review]
    - phase: declare-scope
      load: [design-review]
    - phase: classify-and-fix
      load: [master-design, adaptive-component-design, ui-components, accessibility, readability, responsiveness]
    - phase: targeted-verify
      load: [design-review]
    - phase: learning-promotion
      load: [skill-evolution, skill-eval]

  learning_promotion_policy:
    always_run_after:
      - successful_targeted_verification
      - preserved_gate_regression_check
    allowed_verdicts:
      - promoted
      - eval_only
      - local_only
      - duplicate
      - deferred_unverified
      - not_written_read_only
    promotion_requires:
      - verified_before_after_evidence
      - reusable_reason_not_case_solution_only
      - correct_target_layer
      - duplicate_check
      - transfer_and_counterexample_check
      - regression_eval
      - repository_write_policy_satisfied
    shared_skill_must_not_store:
      - product_names
      - repository_paths
      - route_names
      - exact_product_breakpoints
      - project_specific_component_names
      - raw_case_history

  quality_gates:
    - design_direction_must_be_good_enough_for_refinement
    - failing_gates_must_be_explicit_before_fixing
    - passing_gates_must_be_preserved_unless_user_expands_scope
    - no_drive_by_redesign_or_surface_retheme
    - governing_skill_and_defect_class_checked_before_artifact_patch
    - candidate_fix_must_be_verified_before_shared_learning_promotion
    - fixed_gate_scores_must_reach_8_or_report_residual_gap
    - adjacent_and_preserved_gate_regressions_must_be_checked
    - reduced_motion_touch_semantics_are_hard_regression_gates
    - every_verified_fix_has_a_skill_evolution_verdict
    - promoted_learning_explains_reusable_reason_without_product_specific_history
    - every_promoted_shared_patch_has_regression_eval
    - duplicate_existing_rule_is_not_appended_again
    - repository_write_and_approval_policy_is_respected
    - max_iterations_exit_must_include_honest_gap_and_learning_report

  adapter_requirements:
    artifact_access_method: runtime_defined
    patch_method: runtime_defined
    visual_inspection_method: runtime_defined
    dom_probe_method: runtime_defined
    scoring_scale: "0_to_10"
    pass_threshold: ">=8.0"
    direction_threshold_for_refinement: ">=7.0_average_or_user_approved_direction"
    full_redesign_fallback: redesign-workflow
    skill_evolution_contract: skill-evolution
    eval_method: runtime_defined
    source_repository_write_policy: runtime_defined
