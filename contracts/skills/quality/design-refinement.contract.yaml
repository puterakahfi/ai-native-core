skill_contract:
  id: design-refinement
  category: quality
  type: workflow
  version: "1.2.0"
  capability: bounded_design_gate_refinement_with_preservation_proof

  purpose: >
    Defines the targeted design refinement lifecycle for correcting specific verified
    design failures while preserving an accepted direction, passing regions, component
    contracts, content, assets, behavior, and unaffected implementation. Refinement is
    controlled by an explicit lock, change budget, domain-appropriate evidence, focused
    facade re-review, and learning promotion after a verified fix.

  roles:
    - design_lead
    - governing_design_reviewer
    - implementation_owner
    - specialist_advisor
    - skill_maintainer
    - regression_evaluator

  inputs:
    required:
      - target_url_or_artifact
      - prior_facade_review
      - target_findings
      - accepted_direction
      - preservation_contract
    optional:
      - component_contracts
      - adjacent_regression_gates
      - change_budget
      - baseline_ref
      - max_iterations
      - output_mode
      - approval_mode
      - repository_write_policy

  outputs:
    allowed:
      - refinement_route_decision
      - refinement_lock
      - component_fitness_or_defect_diagnosis
      - change_budget
      - targeted_patch_plan
      - refined_artifact
      - before_after_change_manifest
      - gate_status_delta_report
      - preservation_evidence_report
      - adjacent_regression_report
      - focused_review_result
      - learning_candidate_report
      - learning_promotion_report
      - skill_patch_log
      - regression_eval_result
      - promotion_commit
      - residual_gap_report

  route_contract:
    refinement_requires:
      - accepted_direction_remains_valid
      - verified_FAIL_or_PARTIAL_target_findings_exist
      - primary_domain_coverage_is_BUILT_IN_or_ADAPTER_COVERED
      - governing_reviewer_exists_for_each_target_gate
      - correction_can_be_bounded_without_replacing_foundational_direction
      - preservation_evidence_can_be_collected
    route_to_redesign_when:
      - direction_or_macrostructure_is_wrong
      - visual_language_requires_replacement
      - page_level_component_model_requires_broad_recomposition
      - correction_spans_multiple_foundational_clusters
    route_to_adaptive_component_decision_when:
      - a_local_component_family_may_not_fit_the_task_or_context
      - substitution_boundaries_or_shared_state_contract_are_undefined
    route_to_local_implementation_fix_when:
      - governing_design_rule_and_component_contract_are_already_correct
      - no_new_design_decision_is_required
    evidence_only_when:
      - target_status_is_NOT_VERIFIED

  refinement_lock_contract:
    required_fields:
      - target_gate_ids
      - governing_reviewers
      - target_regions
      - accepted_direction
      - preserved_gate_ids
      - preserved_regions
      - preserved_component_contracts
      - locked_content_assets_and_brand
      - preserved_behavior_and_states
      - allowed_change_layers
      - protected_change_layers
      - required_evidence
    rules:
      - passing_regions_are_protected_by_default
      - component_family_is_protected_unless_pattern_mismatch_is_verified
      - page_macrostructure_is_protected_unless_routed_to_redesign
      - visual_language_and_tokens_are_protected_unless_explicitly_targeted
      - content_and_asset_changes_require_explicit_scope

  change_budget_contract:
    required_fields:
      - allowed_regions
      - allowed_files_or_artifacts
      - allowed_component_contract_fields
      - allowed_visual_or_behavioral_properties
      - expected_side_effects
      - forbidden_or_protected_changes
      - rollback_point
    rules:
      - every_changed_region_or_file_must_map_to_the_target_finding_or_required_dependency
      - broad_retheme_or_opportunistic_cleanup_is_out_of_budget
      - component_substitution_requires_verified_pattern_mismatch_and_design_owner_approval
      - implementation_defect_should_preserve_the_selected_component_contract
      - exceeded_budget_requires_replan_or_route_change_before_continuing

  defect_diagnosis_contract:
    allowed:
      PATTERN_MISMATCH: selected_component_family_is_wrong_for_task_or_context
      IMPLEMENTATION_DEFECT: selected_contract_is_correct_but_implementation_is_broken
      CONTENT_PRESSURE: realistic_content_exceeds_the_component_or_layout_contract
      SYSTEM_CONSTRAINT: design_system_or_primitive_blocks_required_behavior
      LOCAL_VISUAL_DEFECT: bounded_expression_or_hierarchy_failure
      DOMAIN_SPECIALIST_DEFECT: correction_requires_specialized_domain_knowledge
    rules:
      - diagnosis_precedes_patch_selection
      - visible_symptom_does_not_determine_correction_layer
      - adaptive_component_design_owns_component_fitness_and_substitution_reasoning
      - design_review_owns_gate_meaning_and_acceptance
      - local_implementation_does_not_rewrite_shared_skills_by_convenience

  required_phases:
    - id: load-review-state
      order: 1
      description: Load the prior facade route, canonical findings, evidence, coverage, and accepted direction
      gate: verified_target_findings_and_coverage_must_exist
      skills:
        required: [design-review]
        optional: [design-audit]

    - id: declare-lock-and-budget
      order: 2
      description: Declare target and preserve sets, component contracts, protected layers, allowed mutations, evidence, and rollback
      gate: refinement_lock_and_change_budget_must_be_explicit
      skills:
        required: [master-design, design-review]

    - id: diagnose-and-plan
      order: 3
      description: Distinguish component fitness, implementation, content pressure, system constraints, local visual defects, and domain-specialist defects before selecting the correction owner
      gate: diagnosis_and_correction_owner_known_before_patch
      skills:
        required: [master-design]
        optional: [adaptive-component-design, accessibility, readability, responsiveness, motion-design, composition, visual-hierarchy, ui-components]

    - id: apply-bounded-fix
      order: 4
      description: Apply the smallest correction inside the declared change budget while preserving the refinement lock
      gate: patch_must_remain_inside_change_budget
      skills:
        required: []

    - id: targeted-verify
      order: 5
      description: Verify target gates, adjacent regression gates, protected regions, component-state equivalence, and affected hard gates with domain-appropriate evidence
      gate: target_and_preservation_evidence_must_be_complete
      skills:
        required: [design-review]

    - id: learning-promotion
      order: 6
      description: Review every verified reusable fix, generalize its reasoning, deduplicate it, add regression evidence, and promote only to the correct owner
      gate: verified_reusable_fixes_require_skill_evolution_verdict
      skills:
        required: [skill-evolution, skill-eval]

    - id: deliver
      order: 7
      description: Deliver gate deltas, change manifest, preservation evidence, focused verdict, learning verdicts, and residual gaps
      gate: focused_acceptance_and_preservation_report_required
      skills:
        required: []

  skill_load_order:
    - phase: load-review-state
      load: [design-review, design-audit]
    - phase: declare-lock-and-budget
      load: [master-design, design-review]
    - phase: diagnose-and-plan
      load: [master-design, adaptive-component-design, ui-components, accessibility, readability, responsiveness]
    - phase: targeted-verify
      load: [design-review]
    - phase: learning-promotion
      load: [skill-evolution, skill-eval]

  verification_contract:
    requires:
      - fresh_evidence_for_target_gates
      - before_after_change_manifest
      - preserved_region_evidence
      - adjacent_regression_gate_results
      - affected_contextual_hard_gate_results
      - component_state_and_semantics_equivalence_when_applicable
      - actual_target_and_boundary_contexts_when_adaptation_changed
    status_rules:
      - NOT_VERIFIED_returns_to_evidence_collection_not_design_patch
      - FAIL_or_PARTIAL_is_eligible_for_correction
      - NOT_APPLICABLE_requires_no_correction
      - build_success_alone_is_not_design_verification
      - focused_facade_verdict_controls_refinement_completion

  learning_promotion_policy:
    always_run_after:
      - successful_targeted_verification
      - preserved_gate_and_region_regression_check
    allowed_verdicts:
      - promoted
      - eval_only
      - local_only
      - duplicate
      - deferred_unverified
      - not_written_read_only
    promotion_requires:
      - verified_before_after_evidence
      - reusable_reason_not_case_solution_only
      - correct_target_layer
      - duplicate_check
      - transfer_and_counterexample_check
      - regression_eval
      - repository_write_policy_satisfied
    shared_skill_must_not_store:
      - product_names
      - repository_paths
      - route_names
      - exact_product_breakpoints
      - project_specific_component_names
      - raw_case_history

  completion_contract:
    accepted_when:
      - all_target_gates_PASS_or_permitted_CONDITIONAL_PASS
      - no_affected_contextual_hard_gate_fails
      - preservation_contract_passes
      - change_budget_is_not_exceeded
      - required_evidence_is_available
      - primary_domain_coverage_remains_sufficient
    blocked_when:
      - facade_returns_NEEDS_WORK_or_CRITICAL
      - preservation_regression_exists
      - change_budget_is_exceeded
      - target_or_preserved_evidence_is_NOT_VERIFIED
      - coverage_is_LIMITED_or_ROUTE_ELSEWHERE_for_required_claim
      - component_substitution_occurred_without_verified_pattern_mismatch

  quality_gates:
    - accepted_direction_must_be_explicit_and_still_valid
    - target_findings_must_be_verified_FAIL_or_PARTIAL
    - primary_domain_coverage_and_governing_reviewers_must_be_sufficient
    - refinement_lock_and_change_budget_must_precede_patch
    - passing_gates_regions_component_contracts_and_assets_are_preserved_by_default
    - no_drive_by_redesign_retheme_or_opportunistic_cleanup
    - diagnosis_distinguishes_pattern_mismatch_from_implementation_defect
    - component_substitution_requires_verified_component_fitness_reasoning
    - every_change_maps_to_target_finding_or_required_dependency
    - before_after_manifest_and_preservation_evidence_are_required
    - target_adjacent_preserved_and_affected_hard_gates_are_rechecked
    - contextual_hard_gates_are_reviewer_owned_not_global
    - focused_facade_verdict_controls_completion
    - candidate_fix_must_be_verified_before_shared_learning_promotion
    - every_verified_reusable_fix_has_a_skill_evolution_verdict
    - every_promoted_shared_patch_has_regression_eval
    - max_iterations_exit_includes_honest_gap_and_preservation_report

  adapter_requirements:
    artifact_access_method: runtime_defined
    patch_method: runtime_defined
    visual_inspection_method: runtime_defined
    interaction_probe_method: runtime_defined
    before_after_manifest_method: runtime_defined
    change_budget_enforcement: runtime_defined
    full_redesign_fallback: redesign-workflow
    component_fitness_specialist: adaptive-component-design
    skill_evolution_contract: skill-evolution
    eval_method: runtime_defined
    source_repository_write_policy: runtime_defined
