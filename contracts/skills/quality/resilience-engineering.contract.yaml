contract_schema:
  kind: skill_contract
  version: 1.0.0
  path: schemas/skill-contract.schema.yaml
skill_contract:
  id: resilience-engineering
  type: skill
  category: quality
  version: "0.1.0"
  capability: design_for_failure_chaos_engineering_and_graceful_degradation
  roles:
    - resilience_engineer
    - chaos_practitioner
  inputs:
    required:
      - system_or_service_description
    optional:
      - failure_history
      - sla_requirements
      - rto_rpo_targets
  outputs:
    allowed:
      - failure_mode_analysis
      - chaos_experiment_plan
      - circuit_breaker_design
      - graceful_degradation_strategy
      - blast_radius_map
      - rto_rpo_design
  quality_gates:
    - failure_modes_must_be_identified_before_chaos_testing
    - circuit_breaker_must_have_fallback_defined
    - graceful_degradation_preferred_over_total_failure
    - blast_radius_must_be_minimized_by_design
    - chaos_experiments_must_have_hypothesis_and_abort_condition
    - rto_and_rpo_must_be_explicitly_defined
    - load_shedding_strategy_must_exist_for_saturation
    - resilience_tests_must_run_in_staging_before_prod
  adapter_requirements:
    chaos_tool: product_defined
    rto_target: product_defined
    rpo_target: product_defined
    fallback_behavior: product_defined
