contract_schema:
  kind: skill_contract
  version: 1.0.0
  path: schemas/skill-contract.schema.yaml
skill_contract:
  id: web-performance
  category: quality
  type: skill
  version: "1.0.0"
  capability: lcp_cls_inp_optimization_and_performance_budget
  roles:
    - frontend_engineer
    - performance_reviewer
  inputs:
    required:
      - page_artifact
    optional:
      - performance_budget
      - asset_inventory
  outputs:
    allowed:
      - lcp_audit
      - cls_audit
      - inp_audit
      - performance_gate_scores
  quality_gates:
    - lcp_under_2500ms
    - cls_under_0_1
    - no_render_blocking_resources
