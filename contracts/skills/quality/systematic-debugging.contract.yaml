skill_contract:
  id: systematic-debugging
  category: quality
  type: skill
  version: "0.1.0"
  capability: root_cause_investigation_and_fix
  roles:
    - debugger
    - root_cause_analyst
    - quality_investigator
  inputs:
    required:
      - bug_description
      - reproduction_context
    optional:
      - error_message
      - affected_files
      - recent_changes
      - test_command
      - system_components
  outputs:
    allowed:
      - root_cause_statement
      - tight_feedback_loop
      - hypothesis_list
      - fix_implementation
      - regression_test
      - verification_result
  phases:
    - id: root_cause_investigation
      order: 1
      required: true
      gate: understand_why_before_fixing
    - id: pattern_analysis
      order: 2
      required: true
      gate: find_working_reference_before_diffing
    - id: hypothesis_testing
      order: 3
      required: true
      gate: one_variable_at_a_time
    - id: implementation
      order: 4
      required: true
      gate: fix_root_cause_not_symptom
  quality_gates:
    - no_fixes_without_root_cause_investigation
    - tight_feedback_loop_must_exist_before_fixing
    - one_change_at_a_time
    - regression_test_required_before_fix
    - after_3_failed_fixes_question_architecture
    - verify_fix_with_full_test_suite
  adapter_requirements:
    must_complete_phase_1_before_proposing_fixes: true
    must_build_reproducible_feedback_loop: true
    must_not_bundle_multiple_fixes: true
    architecture_review_required_after_3_failures: true
