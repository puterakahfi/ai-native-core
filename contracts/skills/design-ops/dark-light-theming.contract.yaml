skill_contract:
  id: dark-light-theming
  category: design-ops
  type: skill
  version: "1.0.0"
  capability: fouc_prevention_and_token_mapping_for_dark_light_themes
  roles:
    - frontend_engineer
    - design_system_author
  inputs:
    required:
      - color_token_map
      - theme_toggle_requirement
    optional:
      - system_preference_policy
  outputs:
    allowed:
      - theme_token_map
      - fouc_prevention_strategy
      - theming_gate_scores
  quality_gates:
    - no_fouc_on_theme_switch
    - tokens_mapped_for_both_themes
    - system_preference_respected
