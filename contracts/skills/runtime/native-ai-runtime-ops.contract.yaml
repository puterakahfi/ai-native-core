contract_schema:
  kind: skill_contract
  version: 1.0.0
  path: schemas/skill-contract.schema.yaml
skill_contract:
  id: native-ai-runtime-ops
  category: runtime
  type: skill
  version: "0.1.0"
  capability: canonical_runtime_operations
  roles:
    - native_ai_runtime_operations_engineer
    - cloud_runtime_operator
    - ssh_access_operator
    - session_state_safety_guard
  inputs:
    required:
      - runtime_host
      - access_method
      - profile_name
      - operational_goal
      - safety_constraints
    optional:
      - cloud_provider
      - project_repositories
      - profile_distribution_source
      - backup_target
      - gateway_channels
      - security_group_context
      - ssh_config_context
  outputs:
    allowed:
      - runtime_access_plan
      - ssh_connection_handoff
      - canonical_runtime_bootstrap_plan
      - profile_installation_plan
      - project_checkout_plan
      - backup_restore_plan
      - single_writer_policy
      - healthcheck_report
      - operational_runbook
  runtime_model:
    canonical_runtime: "One host/profile owns live Hermes state: state.db, sessions, memories, cron, auth, and local secrets."
    clients: "Other devices connect to the canonical runtime; they do not own or multi-write session state."
    profile_distribution: "Git-backed profile distribution installs reproducible config and skills, but does not sync live state."
    project_checkout: "Project source code is shared through normal project repositories, not through Hermes state sync."
  quality_gates:
    - do_not_commit_secrets_or_live_state
    - enforce_single_writer_session_state
    - verify_ssh_access_before_runtime_setup
    - verify_profile_installation_and_skill_mounts
    - verify_project_checkout_and_dependency_readiness
    - define_backup_restore_before_treating_remote_as_canonical
    - record_commands_and_actual_outputs
  adapter_requirements:
    runtime_specific_commands_must_stay_out_of_core: true
    cloud_provider_specific_steps_must_be_marked_as_provider_specific: true
    secrets_must_be_referenced_as_local_placeholders_only: true
    destructive_or_public_network_changes_require_user_approval: true
