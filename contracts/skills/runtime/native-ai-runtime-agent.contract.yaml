skill_contract:
  id: native-ai-runtime-agent
  category: runtime
  type: skill
  version: "0.1.0"
  capability: product_adapter_runtime_execution
  roles:
    - runtime_agent
    - product_adapter_executor
    - contract_driven_engineer
  inputs:
    required:
      - repo_context
      - product_bindings
    optional:
      - source_of_truth_files
      - workflow_rules
      - verification_policy
      - active_task
  outputs:
    allowed:
      - execution_plan
      - verification_result
      - workflow_output
      - adapter_state
  quality_gates:
    - load_repo_context_before_execution
    - respect_product_binding_contracts
    - verify_against_source_of_truth
    - no_product_facts_leaked_to_core
    - execution_evidence_required_before_claiming_done
  adapter_requirements:
    must_load_product_bindings_before_acting: true
    must_verify_with_real_tool_output: true
    product_specific_rules_stay_in_product_layer: true
