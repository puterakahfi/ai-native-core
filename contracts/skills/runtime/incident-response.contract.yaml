skill_contract:
  id: incident-response
  type: skill
  category: runtime
  version: "0.1.0"
  capability: structured_incident_lifecycle_and_blameless_postmortem
  roles:
    - incident_commander
    - postmortem_author
  inputs:
    required:
      - incident_description
    optional:
      - severity_level
      - system_context
      - timeline
  outputs:
    allowed:
      - incident_timeline
      - triage_decision
      - mitigation_steps
      - postmortem_document
      - action_items
      - prevention_recommendations
  quality_gates:
    - incident_must_be_triaged_before_fix_attempted
    - mitigation_before_root_cause_is_acceptable
    - postmortem_must_be_blameless
    - five_whys_must_reach_systemic_cause_not_human_error
    - action_items_must_have_owner_and_deadline
    - postmortem_must_include_what_went_well
    - prevention_must_address_class_of_problem_not_just_instance
    - incident_severity_must_be_declared_explicitly
  adapter_requirements:
    severity_definition: product_defined
    on_call_process: product_defined
    communication_channel: product_defined
    postmortem_template: product_defined
