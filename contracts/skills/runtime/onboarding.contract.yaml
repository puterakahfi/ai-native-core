contract_schema:
  kind: skill_contract
  version: 1.0.0
  path: schemas/skill-contract.schema.yaml
skill_contract:
  id: onboarding
  type: skill
  category: runtime
  version: "0.1.0"
  capability: bootstrap_agent_and_engineer_context_for_existing_codebase
  roles:
    - context_harvester
    - onboarding_guide
  inputs:
    required:
      - repository_or_codebase
    optional:
      - team_context
      - existing_agents_md
      - onboarding_checklist
  outputs:
    allowed:
      - agents_md_draft
      - codebase_map
      - key_entry_points
      - architecture_summary
      - gotchas_and_pitfalls
      - first_task_recommendations
  quality_gates:
    - codebase_must_be_read_before_any_assumption
    - architecture_style_must_be_identified
    - entry_points_must_be_documented
    - test_command_must_be_verified
    - key_conventions_must_be_extracted_from_code_not_guessed
    - gotchas_must_be_discovered_from_existing_issues_or_code
    - agents_md_must_be_produced_as_output
    - onboarding_must_not_assume_any_framework_without_evidence
  adapter_requirements:
    repo_structure: product_defined
    ci_system: product_defined
    team_conventions: product_defined
