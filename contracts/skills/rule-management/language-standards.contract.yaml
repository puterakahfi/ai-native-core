skill_contract:
  id: language-standards
  type: skill
  category: rule-management
  version: "0.1.0"
  capability: enforce_consistent_declared_language_across_engineering_artifacts
  roles:
    - language_enforcer
    - communication_standards_author
  inputs:
    required:
      - artifact_type
      - content
      - declared_language
    optional:
      - product_context
      - team_locale
  outputs:
    allowed:
      - language_compliance_verdict
      - violation_list
      - corrected_artifact
  quality_gates:
    - artifact_language_must_be_explicitly_declared
    - code_identifiers_must_match_declared_language
    - commit_messages_must_match_declared_language
    - pr_titles_and_descriptions_must_match_declared_language
    - code_comments_must_match_declared_language
    - no_mixed_language_within_same_artifact_type
    - skill_and_test_content_must_match_declared_language
    - commit_type_prefix_always_follows_conventional_commits_spec
  adapter_requirements:
    artifact_language: product_defined
    team_communication_language: product_defined
    allowed_exceptions: product_defined
    enforcement_level: product_defined
