skill_contract:
  id: language-standards
  type: skill
  category: rule-management
  version: "0.1.0"
  capability: enforce_english_as_lingua_franca_for_code_and_artifacts
  roles:
    - language_enforcer
    - communication_standards_author
  inputs:
    required:
      - artifact_type
      - content
    optional:
      - product_context
      - team_locale
  outputs:
    allowed:
      - language_compliance_verdict
      - violation_list
      - corrected_artifact
  quality_gates:
    - code_identifiers_must_be_english
    - commit_messages_must_be_english
    - pr_titles_and_descriptions_must_be_english
    - issue_and_ticket_titles_must_be_english
    - code_comments_must_be_english
    - skill_and_contract_content_must_be_english
    - test_cases_and_triggers_must_be_english
    - team_language_exceptions_must_be_explicitly_declared
  adapter_requirements:
    team_locale: product_defined
    allowed_exceptions: product_defined
    enforcement_level: product_defined
