skill_contract:
  id: rule-manager
  type: skill
  category: rule-management
  version: "0.1.0"
  capability: rule_authoring_validation_and_enforcement
  roles:
    - rule_author
    - constraint_enforcer
    - governance_reviewer
  inputs:
    required:
      - rule_target
    optional:
      - existing_rules_ref
      - engineering_contract_ref
      - product_context
      - agent_runtime_ref
  outputs:
    allowed:
      - rule_document
      - agents_md
      - cursorrules
      - rule_violation_report
      - rule_gap_analysis
      - rule_update_recommendation
  quality_gates:
    - rules_must_be_specific_not_aspirational
    - rules_must_state_what_agent_must_not_do
    - rules_must_not_duplicate_engineering_contract
    - rule_change_requires_review
    - rules_must_be_traceable_to_product_or_engineering_contract
    - no_conflicting_rules_in_same_scope
  adapter_requirements:
    rule_format: product_defined
    rule_storage: product_defined
    enforcement_mechanism: product_defined
    scope: product_defined
