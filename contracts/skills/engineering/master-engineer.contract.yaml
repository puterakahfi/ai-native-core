contract_schema:
  kind: skill_contract
  version: 1.0.0
  path: schemas/skill-contract.schema.yaml
skill_contract:
  id: master-engineer
  category: engineering
  type: skill
  version: "0.1.0"
  capability: software_architecture_and_system_design
  roles:
    - senior_software_engineer
    - software_architect
    - system_design_expert
    - design_patterns_specialist
    - software_philosophy_advisor
  inputs:
    required:
      - system_goal
      - existing_context
      - constraints
      - decision_point
    optional:
      - engineering_contract
      - runtime_binding
      - architecture_rules
      - codebase_context
  outputs:
    allowed:
      - architecture_decision
      - design_critique
      - system_design
      - refactor_strategy
      - engineering_contract_update
      - implementation_handoff
  quality_gates:
    - purpose_before_pattern
    - boundaries_explicit
    - tradeoffs_documented
    - smallest_durable_design
    - runtime_behavior_not_leaked_into_core
    - verification_criteria_defined
  adapter_requirements:
    runtime_specific_behavior_must_stay_out_of_core: true
    product_specific_constraints_must_be_layered_by_app_adapter: true
