skill_contract:
  id: context-engineering
  type: skill
  category: context
  version: "0.1.0"
  capability: institutional_context_authoring_and_curation
  roles:
    - context_engineer
    - agents_md_author
    - guardrail_designer
  inputs:
    required:
      - product_or_repo_ref
    optional:
      - engineering_contract_ref
      - design_contract_ref
      - existing_agents_md
      - existing_cursorrules
      - team_conventions
  outputs:
    allowed:
      - agents_md
      - cursorrules
      - context_pack_template
      - guardrail_rules
      - context_gap_report
  quality_gates:
    - context_must_encode_architecture_constraints_not_just_preferences
    - rules_must_be_specific_and_enforceable
    - context_must_include_what_agent_must_not_do
    - context_must_reference_engineering_contract
    - no_duplicate_rules_across_context_files
    - context_must_be_versioned_and_reviewed
    - vague_context_like_follow_best_practices_is_forbidden
  adapter_requirements:
    context_file_format: product_defined
    storage_location: product_defined
    review_policy: product_defined
    staleness_check_interval: product_defined
