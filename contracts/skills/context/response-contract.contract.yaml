skill_contract:
  id: response-contract
  type: skill
  category: context
  version: "0.1.0"
  capability: enforce_output_verbosity_and_filler_elimination
  roles:
    - response_auditor
    - verbosity_enforcer
  inputs:
    required:
      - agent_response
    optional:
      - verbosity_level
      - task_complexity
  outputs:
    allowed:
      - compliant_response
      - violation_report
      - token_savings_estimate
  quality_gates:
    - no_filler_openers
    - no_conclusion_fluff
    - no_unnecessary_hedges
    - code_and_commands_always_exact
    - response_length_proportional_to_task_complexity
    - no_unsolicited_alternatives
    - lead_with_answer_not_preamble
    - verbosity_level_must_be_declared_in_agents_md
  adapter_requirements:
    verbosity_level: product_defined
    filler_exceptions: product_defined
    code_format: product_defined
