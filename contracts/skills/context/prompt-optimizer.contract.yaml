skill_contract:
  id: prompt-optimizer
  type: skill
  category: context
  version: "0.1.0"
  capability: transform_intent_into_precise_token_efficient_prompt
  roles:
    - prompt_engineer
    - intent_clarifier
  inputs:
    required:
      - raw_intent
    optional:
      - context_pack
      - available_skills
      - output_format_expectation
      - token_budget
  outputs:
    allowed:
      - optimized_prompt
      - scope_declaration
      - constraint_list
      - stop_condition
      - token_estimate
  quality_gates:
    - optimized_prompt_must_have_explicit_scope_in_and_out
    - optimized_prompt_must_have_explicit_output_format
    - optimized_prompt_must_have_stop_condition
    - no_ambiguous_verbs_like_improve_or_make_better
    - constraint_list_must_be_present
    - prompt_must_not_require_agent_to_guess_intent
    - optimized_prompt_must_be_shorter_or_more_precise_than_raw_intent
    - skills_to_load_must_be_declared_if_known
  adapter_requirements:
    token_budget: product_defined
    output_format_standard: product_defined
    verbosity_level: product_defined
