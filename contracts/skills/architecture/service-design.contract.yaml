contract_schema:
  kind: skill_contract
  version: 1.0.0
  path: schemas/skill-contract.schema.yaml
skill_contract:
  id: service-design
  type: skill
  category: architecture
  version: "0.1.0"
  capability: design_service_boundaries_and_inter_service_communication
  roles:
    - service_architect
    - distributed_systems_designer
  inputs:
    required:
      - domain_context
    optional:
      - existing_monolith
      - team_topology
      - traffic_profile
  outputs:
    allowed:
      - service_boundary_map
      - communication_pattern_decision
      - api_contract_outline
      - data_ownership_map
      - decomposition_rationale
  quality_gates:
    - service_boundary_must_align_with_bounded_context
    - each_service_must_own_its_data
    - no_shared_database_across_services
    - synchronous_vs_asynchronous_must_be_justified
    - circular_dependencies_between_services_are_forbidden
    - decomposition_must_be_justified_by_forces_not_preference
    - failure_modes_must_be_considered_per_communication_pattern
    - strangler_fig_preferred_over_big_bang_rewrite
  adapter_requirements:
    service_mesh: product_defined
    api_gateway: product_defined
    event_bus: product_defined
    deployment_target: product_defined
