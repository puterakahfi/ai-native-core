skill_contract:
  id: design-patterns
  type: skill
  category: architecture
  version: "0.1.0"
  capability: identify_and_apply_appropriate_design_patterns_for_given_forces
  roles:
    - pattern_advisor
    - refactoring_strategist
  inputs:
    required:
      - problem_description
    optional:
      - existing_code
      - language_and_framework
      - constraints
  outputs:
    allowed:
      - pattern_recommendation
      - pattern_justification
      - implementation_sketch
      - trade_off_analysis
      - anti_pattern_warnings
  quality_gates:
    - pattern_must_be_justified_by_forces_not_preference
    - over_engineering_must_be_called_out
    - alternative_patterns_must_be_considered
    - pattern_name_must_match_implementation
    - no_pattern_applied_speculatively
    - implementation_must_preserve_open_closed_principle
    - trade_offs_must_be_explicit
  adapter_requirements:
    language: product_defined
    framework: product_defined
    team_experience_level: product_defined
