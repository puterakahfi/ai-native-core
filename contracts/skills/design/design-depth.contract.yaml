skill_contract:
  id: design-depth
  category: design
  type: contract
  version: "2.0.0"
  capability: visual_depth_layering_atmosphere_interleave

  description: >
    Defines what any depth adapter must address — layer stack declaration,
    atmosphere techniques, typography interleave, scale-as-distance.
    Flat is valid when Kanso applies; depth requires intent and assets.
    v2: adds elevation inheritance model (recursive depth resolution).

  roles:
    - visual_designer
    - redesign_workflow

  # ─── Perceptual Depth Model ───────────────────────────────────────────────
  #
  # Humans perceive ~4 distinct depth planes before visual confusion.
  # Every surface — page, section, or component — maps to exactly one plane.
  # Transparent background = "plane inherited from parent", NOT "no plane".
  #
  depth_planes:
    "0":
      name: canvas
      description: Viewport background. Never perceived directly — sets the tone.
      css_z_index: 0
      token: --depth-canvas
    "1":
      name: atmosphere
      description: Ambient wash, blur, shadow, gradient. Felt, not seen.
      css_z_index: 1
      token: --depth-atmosphere
    "2":
      name: content
      description: Primary content layer — text, illustrations, component surfaces.
      css_z_index: 2
      token: --depth-content
    "3":
      name: accent
      description: Foreground accents — badges, tooltips, highlights, overlays.
      css_z_index: 3
      token: --depth-accent

  # ─── Elevation Inheritance ────────────────────────────────────────────────
  #
  # Components declare their depth_plane (global) and content_elevation (internal).
  # content_elevation is always RELATIVE (+n from component's own plane).
  # Transparent background = inherit parent plane (NOT plane 0).
  #
  # Example: Hero section
  #   depth_plane: 2 (content)
  #   background: transparent → inherits page canvas (plane 0)
  #   hero-name text: depth_plane 2 (same as section)
  #   illustration: depth_plane 2 + content_elevation +1 = z-index 3
  #   hero-bio text: depth_plane 2 + content_elevation +2 = z-index 4
  #
  # Rule: content_elevation ceiling = +2 within one component.
  # If you need +3, split into a new component with its own depth_plane.
  #
  elevation_inheritance:
    rule: relative_to_parent_plane
    max_internal_elevation: 2
    transparent_resolves_to: inherit_parent
    overflow_action: split_component

  # ─── Component Depth Declaration Schema ───────────────────────────────────
  #
  # Every component MUST declare depth metadata.
  # Adapter/implementation fills these from the contract.
  #
  component_depth_schema:
    required:
      - depth_plane       # integer 0–3 (global plane)
      - background        # color token | transparent | inherit
    optional:
      - content_elevation # integer +0 to +2 (internal sub-layers)
      - blend_mode        # CSS mix-blend-mode for atmospheric integration
      - isolation         # CSS isolation: isolate | auto

  # ─── Layer Stack Declaration Rule ─────────────────────────────────────────
  #
  # MUST be declared before any implementation begins.
  # Format: name | plane | internal_elevation | background | note
  #
  layer_stack_template: |
    # Global Stack
    canvas        | 0 | +0 | --bg                | page background
    atmosphere    | 1 | +0 | transparent         | CSS radial/blur wash

    # Per-section example (hero)
    hero-section  | 2 | +0 | transparent→inherit | no border, no bg
    hero-name     | 2 | +0 | —                   | text, behind object
    hero-object   | 2 | +1 | transparent         | illustration/shape
    hero-bio      | 2 | +2 | —                   | text, above object

  inputs:
    required:
      - genre_selection
      - depth_mode
    optional:
      - art_assets
      - illustration_system

  outputs:
    allowed:
      - layer_stack_declaration    # table: name | plane | elevation | bg | note
      - atmosphere_spec            # CSS technique + blend-mode
      - interleave_spec            # which elements cross z-index boundary
      - scale_rule                 # scale-as-distance guideline
      - component_depth_metadata   # depth_plane + content_elevation per component

  quality_gates:
    - layer_stack_declared_before_produce
    - all_components_declare_depth_plane
    - transparent_bg_resolved_to_parent_not_zero
    - content_elevation_max_plus_2_per_component
    - objects_have_no_hard_edges
    - body_text_remains_readable_over_objects
    - interleave_has_mobile_fallback
    - depth_mode_matches_asset_availability

  boundary:
    covers:
      - layer_z_architecture
      - atmosphere_css_techniques
      - typography_interleave
      - scale_distance_perspective
      - genre_depth_patterns
      - elevation_inheritance_model
      - component_depth_declaration
    does_not_cover:
      - motion_parallax         # → motion-design
      - 3d_transforms_scroll    # → motion-design
      - illustration_creation   # → external asset
