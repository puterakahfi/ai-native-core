skill_contract:
  id: design-strategy
  category: design
  type: port
  version: "1.0.0"
  capability: ux_strategy_content_port_user_centered_thinking
  description: >
    Port contract for UX strategy and content. Abstracts user-centered
    decisions — psychology, IA, CRO, copy, content.
  roles:
    - ux_strategist
    - redesign_workflow
  adapters:
    - id: ux-psychology
      concern: user_cognition_behavior
      load_order: 1
    - id: information-architecture
      concern: navigation_content_taxonomy
      load_order: 2
    - id: cro
      concern: conversion_optimization
      load_order: 3
      condition: conversion_is_explicit_goal
    - id: copywriting
      concern: ui_copy_microcopy
      load_order: 4
    - id: content-strategy
      concern: content_planning_inventory
      load_order: 5
  quality_gates:
    - strategy_before_aesthetics
    - cro_only_when_conversion_is_goal
    - copy_decided_before_layout_locked
