skill_contract:
  id: design-genre
  category: design
  type: skill
  version: "1.0.0"
  capability: genre_detection_signal_matching_and_slop_prevention
  roles:
    - design_reviewer
    - visual_designer
  inputs:
    required:
      - brief_signals
      - pre_flight_observations
    optional:
      - reference_sites
      - audience_profile
  outputs:
    allowed:
      - genre_selection
      - signal_justification
      - slop_gate_results
      - genre_gate_scores
  quality_gates:
    - genre_must_match_primary_brief_signals
    - no_ai_slop_patterns_detected
    - visual_direction_coherent_with_genre
