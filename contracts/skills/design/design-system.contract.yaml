skill_contract:
  id: design-system
  category: design
  type: skill
  version: "1.0.0"
  capability: design_token_decisions_and_semantic_roles
  roles:
    - design_system_author
    - token_reviewer
  inputs:
    required:
      - color_palette
      - type_scale_intent
    optional:
      - spacing_base_unit
      - existing_token_map
  outputs:
    allowed:
      - token_map
      - semantic_role_assignments
      - token_violation_list
      - design_system_gate_scores
  quality_gates:
    - one_token_one_semantic_role
    - no_token_collapse
    - spacing_multiples_of_base_unit
