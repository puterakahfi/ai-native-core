skill_contract:
  id: responsiveness
  category: design
  type: skill
  version: "1.0.0"
  capability: breakpoint_strategy_fluid_grid_and_touch_targets
  roles:
    - frontend_engineer
    - ux_reviewer
  inputs:
    required:
      - layout_artifact
    optional:
      - breakpoint_definitions
      - touch_target_policy
  outputs:
    allowed:
      - breakpoint_audit
      - touch_target_report
      - type_scaling_audit
      - responsiveness_gate_scores
  quality_gates:
    - all_interactive_elements_min_44x44px
    - no_horizontal_overflow_on_mobile
    - clamp_used_for_fluid_type_scaling
    - single_column_layout_on_mobile
