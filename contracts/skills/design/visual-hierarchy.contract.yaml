skill_contract:
  id: visual-hierarchy
  category: design
  type: skill
  version: "1.0.0"
  capability: typographic_hierarchy_and_weight_decay
  roles:
    - visual_designer
    - typography_reviewer
    - design_reviewer
  inputs:
    required:
      - heading_inventory
      - type_scale_ref
    optional:
      - section_map
      - color_token_ref
  outputs:
    allowed:
      - hierarchy_verdict
      - weight_decay_report
      - heading_role_map
      - contrast_level_audit
      - hierarchy_gate_scores
  quality_gates:
    - supporting_h2_must_be_60pct_or_less_of_h1_size
    - no_h2_larger_than_h1
    - minimum_3_distinct_contrast_levels
    - no_section_heading_heavier_than_hero_h1
