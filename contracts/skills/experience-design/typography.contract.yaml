skill_contract:
  id: typography
  category: experience-design
  type: contract
  version: "1.0.0"
  capability: expressive_structural_typography_decisions
  description: >
    Defines what any typography adapter must address — typeface selection,
    modular scale, hierarchy, rhythm, and rendering. Layer 2 of visual design.
    This is the abstraction; design-typography is the implementation.
  roles:
    - visual_designer
    - design_reviewer
  inputs:
    required:
      - genre_selection
    optional:
      - brand_typeface_constraints
      - platform_constraints
  outputs:
    allowed:
      - typeface_pair
      - modular_scale
      - hierarchy_mapping
      - rhythm_spec
      - rendering_spec
  quality_gates:
    - genre_loaded_before_typeface_selection
    - scale_derived_not_arbitrary
    - h1_body_ratio_appropriate_for_weight
    - max_two_typefaces_plus_mono
    - variable_fonts_preferred
    - font_variation_settings_explicit
  boundary:
    covers:
      - typeface_personality_and_selection
      - display_body_pairing
      - modular_scale_selection
      - hierarchy_h1_to_caption
      - leading_tracking_rhythm
      - font_rendering_antialiasing
      - genre_to_typeface_mapping
    does_not_cover:
      - contrast_ratio_wcag          # → readability skill
      - characters_per_line          # → readability skill
      - minimum_font_size_px         # → readability skill
