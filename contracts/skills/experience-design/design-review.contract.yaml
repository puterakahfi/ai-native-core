skill_contract:
  id: design-review
  category: experience-design
  version: "0.1.0"
  capability: design_system_compliance_and_slop_detection
  roles:
    - design_reviewer
    - ui_quality_enforcer
    - ai_slop_detector
  inputs:
    required:
      - design_artifact
      - design_system_contract_ref
    optional:
      - page_pattern_contract_ref
      - existing_component_list
      - visual_direction_ref
      - screenshot_or_mockup
  outputs:
    allowed:
      - compliance_verdict
      - slop_pattern_list
      - violation_list
      - intentionality_assessment
      - consistency_verdict
      - recommendation_list
      - approved_flag
  quality_gates:
    - must_load_design_system_contract_before_review
    - must_check_visual_direction_compliance
    - must_detect_ai_template_patterns
    - must_detect_generic_admin_panel_smell
    - must_check_component_reuse_vs_one_off_styles
    - must_check_color_token_compliance
    - must_check_typography_compliance
    - must_check_layout_pattern_compliance
    - must_check_status_badge_rule_compliance
    - must_check_responsive_rules
    - must_check_accessibility_baseline
    - must_flag_must_not_feel_like_violations
    - vague_prompt_output_make_it_clean_is_forbidden
    - random_page_level_styles_are_forbidden
  adapter_requirements:
    design_system_contract_source: product_defined
    slop_severity_policy: product_defined
    blocking_vs_warning_policy: product_defined
    visual_direction_source: product_defined
