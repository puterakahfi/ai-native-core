skill_contract:
  id: readability
  category: experience-design
  type: skill
  version: "1.0.0"
  capability: legibility_scoring_and_dead_space_detection
  roles:
    - readability_reviewer
    - content_designer
  inputs:
    required:
      - text_content_inventory
      - rendered_layout_ref
    optional:
      - contrast_token_map
      - viewport_dimensions
  outputs:
    allowed:
      - legibility_score
      - line_length_audit
      - dead_space_verdict
      - readability_gate_scores
  quality_gates:
    - body_prose_max_65ch
    - hero_stance_max_44ch_not_px
    - dead_space_above_hero_forbidden
    - no_unframed_void_before_focal_point
