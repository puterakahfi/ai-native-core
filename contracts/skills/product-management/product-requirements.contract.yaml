skill_contract:
  id: product-requirements
  type: skill
  category: product-management
  version: "0.1.0"
  capability: author_and_verify_product_requirements_documents
  roles:
    - prd_author
    - product_manager
    - acceptance_criteria_owner
    - product_spec_reviewer
  inputs:
    required:
      - product_or_feature_intent
      - target_users
      - problem_statement
    optional:
      - user_research
      - business_goals
      - technical_constraints
      - design_constraints
      - market_context
      - existing_prd
      - stakeholder_feedback
      - launch_constraints
  outputs:
    allowed:
      - prd
      - requirements_summary
      - scope_boundary
      - acceptance_criteria
      - success_metrics
      - risk_and_dependency_list
      - open_questions
      - launch_readiness_criteria
  required_prd_sections:
    - title
    - problem_statement
    - target_users
    - goals
    - non_goals
    - success_metrics
    - scope_in
    - scope_out
    - user_stories_or_jobs_to_be_done
    - functional_requirements
    - non_functional_requirements
    - acceptance_criteria
    - constraints
    - dependencies
    - risks
    - open_questions
    - launch_criteria
  quality_gates:
    - problem_statement_must_be_user_or_business_outcome_not_solution
    - target_users_must_be_explicit
    - goals_and_non_goals_must_both_exist
    - success_metrics_must_be_measurable
    - scope_in_and_scope_out_must_both_be_explicit
    - requirements_must_be_testable_or_traceable_to_testable_acceptance_criteria
    - acceptance_criteria_must_be_verifiable
    - non_functional_requirements_must_include_reliability_security_or_performance_when_relevant
    - constraints_and_dependencies_must_be_explicit
    - open_questions_must_be_named_not_hidden
    - launch_criteria_must_define_readiness_not_just_completion
    - implementation_details_must_be_excluded_unless_marked_as_constraints
  traceability:
    prd_to_spec: required
    requirement_to_acceptance_criteria: required
    acceptance_criteria_to_verification: required
    scope_to_mvp_slice: recommended
  adapter_requirements:
    prd_format: product_defined
    requirement_id_format: product_defined
    stakeholder_approval: product_defined
    task_tracker: product_defined
    evidence_store: product_defined
