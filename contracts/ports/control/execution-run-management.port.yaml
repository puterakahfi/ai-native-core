port_contract:
  id: execution-run-management
  kind: control_port
  version: "0.1.0"
  capability: manage_traceable_execution_run_records
  direction: bidirectional
  semantic_owner_context: runtime_and_execution
  binding_owner_context: integration_and_binding
  consumer_contexts:
    - method_and_workflow
    - evidence_evaluation_and_review
    - governance_risk_and_authority
    - product_delivery_and_registry
  purpose: >
    Create, transition, inspect, and preserve traceable ExecutionRun records without
    executing the work itself or collapsing review, approval, completion, and delivery
    states into the execution lifecycle.
  boundary:
    owns:
      - execution_run_record_creation
      - execution_status_transition
      - execution_step_recording
      - tool_invocation_recording
      - execution_artifact_reference
      - operational_outcome_recording
    delegates:
      - actual_tool_execution
      - workflow_definition
      - workflow_coordination
      - evidence_assessment
      - review
      - approval
      - completion_assessment
      - delivery
    does_not_own:
      - source_of_truth_task
      - technical_permission_grant
      - authority
      - product_acceptance
      - canonical_contract
      - provider_credentials
  interactions:
    requests:
      - id: create_execution_run
        description: Create a requested execution run with attributable intent, scope, and binding references.
        required_fields:
          - id: run_id
            description: Stable identifier reserved for the execution run.
          - id: intent_ref
            description: Attributable intent or task reference for the bounded execution.
          - id: scope_ref
            description: Reference defining the allowed execution scope.
          - id: adapter_binding_ref
            description: Selected compatible adapter or runtime binding.
          - id: capacity_assessment_ref
            description: Current bounded capacity assessment.
        optional_fields:
          - id: workflow_coordination_ref
            description: Workflow coordination checkpoint associated with this execution when applicable.
          - id: authorization_ref
            description: Authority-bearing authorization reference when policy requires it.
          - id: context_pack_ref
            description: Context checkpoint used to prepare the execution.
      - id: record_execution_step
        description: Append one actual execution step and its bounded operational outcome.
        required_fields:
          - id: run_id
            description: Execution run receiving the step.
          - id: step_id
            description: Stable identifier for the actual step.
          - id: action
            description: Actual operation performed by the host mechanism.
          - id: outcome
            description: Recorded operational outcome including failure or uncertainty.
        optional_fields:
          - id: tool_invocation_ref
            description: Tool invocation associated with the step.
          - id: artifact_refs
            description: Artifacts consumed, produced, or modified by the step.
          - id: evidence_candidate_refs
            description: Observation references that may later become evidence items.
      - id: transition_execution_status
        description: Apply one valid ExecutionStatus transition with its attributable cause.
        required_fields:
          - id: run_id
            description: Execution run being transitioned.
          - id: expected_from
            description: Current expected ExecutionStatus.
          - id: transition_to
            description: Target ExecutionStatus allowed by the lifecycle.
          - id: cause_ref
            description: Attributable operation, event, or decision causing the transition.
        optional_fields: []
      - id: inspect_execution_run
        description: Read one execution run without deriving review, approval, or completion claims.
        required_fields:
          - id: run_id
            description: Execution run to inspect.
        optional_fields: []
    responses:
      - id: execution_run_snapshot
        description: Return the current execution record, steps, artifacts, and operational status.
        fields:
          - id: run_id
            description: Stable execution run identifier.
          - id: execution_status
            description: Current canonical ExecutionStatus only.
          - id: steps
            description: Attributable actual execution-step records.
          - id: artifacts
            description: Referenced execution artifacts and provenance.
          - id: operational_outcome
            description: Bounded execution result without broader acceptance claims.
          - id: external_assessment_refs
            description: Separate evidence, review, approval, or completion references.
    events:
      - id: execution_run_created
        description: A requested ExecutionRun record was created.
      - id: execution_status_changed
        description: The ExecutionRun entered another valid ExecutionStatus.
      - id: execution_step_recorded
        description: One actual execution step and outcome was recorded.
      - id: execution_run_succeeded
        description: The bounded execution ended with ExecutionStatus succeeded.
      - id: execution_run_failed
        description: The bounded execution ended with ExecutionStatus failed.
    streams:
      - id: execution_run_events
        description: Ordered attributable runtime events for one execution run.
  failures:
    errors:
      - code: execution_run_not_found
        meaning: The requested ExecutionRun identity cannot be resolved.
        retryable: false
        partial_result_allowed: false
      - code: execution_status_conflict
        meaning: The expected current status does not match the stored execution status.
        retryable: true
        partial_result_allowed: false
      - code: invalid_execution_transition
        meaning: The requested transition violates the canonical ExecutionStatus lifecycle.
        retryable: false
        partial_result_allowed: false
      - code: missing_execution_provenance
        meaning: Required intent, scope, binding, capacity, action, or cause attribution is absent.
        retryable: false
        partial_result_allowed: false
      - code: execution_record_partial
        meaning: Some execution detail is unavailable while a bounded partial snapshot remains attributable.
        retryable: true
        partial_result_allowed: true
    partial_result_policy: explicit
    unknown_or_not_checkable_policy: >
      Preserve unavailable or unverified execution details explicitly; never convert absent
      run evidence into succeeded, reviewed, approved, delivered, or complete state.
  state_transitions:
    - status_family: execution_status
      from: requested
      to: planned
      condition: A bounded execution plan and required references have been recorded.
    - status_family: execution_status
      from: planned
      to: authorized
      condition: Applicable authorization and capacity requirements are satisfied.
    - status_family: execution_status
      from: authorized
      to: running
      condition: The host mechanism has actually started the bounded operation.
    - status_family: execution_status
      from: running
      to: blocked
      condition: A declared blocker prevents responsible continuation.
    - status_family: execution_status
      from: running
      to: failed
      condition: The bounded operation ended unsuccessfully with recorded failure.
    - status_family: execution_status
      from: running
      to: cancelled
      condition: An attributable cancellation ended the bounded operation.
    - status_family: execution_status
      from: running
      to: succeeded
      condition: The bounded operation completed successfully as an execution outcome.
    - status_family: execution_status
      from: blocked
      to: running
      condition: The blocker was resolved and continued execution remains authorized.
    - status_family: execution_status
      from: blocked
      to: cancelled
      condition: The blocked run was intentionally cancelled.
  authorization:
    mode: policy_dependent
    required_for:
      - start_material_execution
      - resume_blocked_execution
      - destructive_operation
    permission_is_not_authority: true
    review_is_not_approval: true
    authority_reference_required: true
  idempotency:
    mode: resource_key
    key_scope: run_id_and_operation_id
  observability:
    required_events:
      - execution_run_created
      - execution_status_changed
      - execution_step_recorded
      - execution_run_succeeded
      - execution_run_failed
    correlation_fields:
      - run_id
      - step_id
      - workflow_coordination_ref
      - adapter_binding_ref
      - tool_invocation_ref
    sensitive_fields:
      - action
      - outcome
      - artifact_refs
      - context_pack_ref
  adapter_requirements:
    contract_reference:
      require_id: true
      require_path: true
      require_version: true
    requirements:
      - preserve_execution_status_family
      - use_optimistic_status_transition_checks
      - record_actual_steps_not_plans
      - use_workflow_coordination_references_without_creating_workflow_run_status
      - keep_review_approval_completion_and_delivery_external
      - redact_secrets_from_execution_records
  compatibility:
    policy: semver
    breaking_changes:
      - change_execution_status_meaning
      - add_required_execution_reference
      - remove_request_or_response_operation
      - collapse_external_status_family
      - introduce_unmodeled_workflow_run_lifecycle
      - change_idempotency_scope
    aliases:
      - execution-run
    supersedes: []
    legacy_contract_refs: []
  quality_gates:
    - actual_execution_is_distinct_from_plan_and_request
    - execution_status_uses_only_canonical_execution_family
    - workflow_coordination_is_external_and_does_not_create_workflow_run_status
    - review_approval_completion_and_delivery_are_external_refs
    - failures_and_partial_records_are_not_hidden
    - execution_permission_does_not_imply_authority
