contract_schema:
  kind: port_contract
  version: 1.0.0
  path: schemas/port-contract.schema.yaml

port_contract:
  id: company-registry
  kind: control_port
  version: 0.1.0
  capability: register_resolve_and_transition_company_identity
  direction: inbound
  semantic_owner_context: product_delivery_and_registry
  binding_owner_context: integration_and_binding
  consumer_contexts:
    - product_delivery_and_registry
    - governance_risk_and_authority
    - context_knowledge_and_memory
    - method_and_workflow
    - runtime_and_execution
  purpose: Provide a runtime-agnostic control boundary for registering canonical company identities, resolving and reading company registry state, and requesting lifecycle transitions without owning persistence, authority, runtime execution, organization semantics, or product acceptance.
  boundary:
    owns:
      - company_registration_request_and_result
      - company_identity_resolution
      - company_registry_read_result
      - company_lifecycle_transition_request_and_result
      - company_status_and_version_resolution
    delegates:
      - persistence
      - authorization_assessment
      - actor_and_authority_resolution
      - organization_management
      - context_pack_resolution
      - runtime_execution
    does_not_own:
      - company_business_policy
      - sop_semantics
      - organization_role_or_member_semantics
      - product_or_project_semantics
      - work_execution
      - knowledge_storage
      - credential_storage
      - approval
      - execution_authorization
      - product_acceptance
  interactions:
    requests:
      - id: register_company
        description: Register one canonical company identity as a new draft company.
        required_fields:
          - id: request_ref
            description: Stable request reference for this registration attempt.
          - id: company_ref
            description: Proposed stable immutable non-recyclable company reference.
          - id: identity_descriptor_ref
            description: Reference to mutable company identity attributes without redefining company_ref.
          - id: actor_ref
            description: Attributable actor requesting company registration.
          - id: authorization_assessment_ref
            description: Current authorization assessment covering this registration mutation.
        optional_fields:
          - id: expected_absence_ref
            description: Evidence reference supporting the expectation that the company identity is not already registered.
      - id: resolve_company
        description: Resolve one registered company locator to its canonical company_ref without mutating registry state.
        required_fields:
          - id: request_ref
            description: Stable request reference for this resolution attempt.
          - id: company_locator_ref
            description: Registered locator reference used to resolve canonical company identity.
        optional_fields:
          - id: expected_company_version
            description: Optional expected company version used to detect stale resolution assumptions.
      - id: get_company
        description: Read one canonical company registry record by company_ref without mutating company state.
        required_fields:
          - id: request_ref
            description: Stable request reference for this company read.
          - id: company_ref
            description: Canonical company reference to retrieve.
        optional_fields:
          - id: expected_company_version
            description: Optional expected company version used to detect stale reads.
      - id: activate_company
        description: Request the canonical draft or suspended company to transition to active.
        required_fields:
          - id: request_ref
            description: Stable request reference for this activation attempt.
          - id: company_ref
            description: Canonical company reference to activate.
          - id: expected_company_version
            description: Expected current company version for optimistic concurrency.
          - id: actor_ref
            description: Attributable actor requesting activation.
          - id: authorization_assessment_ref
            description: Current authorization assessment covering this lifecycle mutation.
        optional_fields:
          - id: transition_reason_ref
            description: Optional attributable reason or decision reference for the activation.
      - id: suspend_company
        description: Request an active company to transition to suspended without mutating unrelated company records.
        required_fields:
          - id: request_ref
            description: Stable request reference for this suspension attempt.
          - id: company_ref
            description: Canonical company reference to suspend.
          - id: expected_company_version
            description: Expected current company version for optimistic concurrency.
          - id: actor_ref
            description: Attributable actor requesting suspension.
          - id: authorization_assessment_ref
            description: Current authorization assessment covering this lifecycle mutation.
        optional_fields:
          - id: transition_reason_ref
            description: Optional attributable reason or decision reference for the suspension.
      - id: archive_company
        description: Request a suspended company to transition to terminal archived state.
        required_fields:
          - id: request_ref
            description: Stable request reference for this archival attempt.
          - id: company_ref
            description: Canonical company reference to archive.
          - id: expected_company_version
            description: Expected current company version for optimistic concurrency.
          - id: actor_ref
            description: Attributable actor requesting archival.
          - id: authorization_assessment_ref
            description: Current authorization assessment covering this lifecycle mutation.
        optional_fields:
          - id: transition_reason_ref
            description: Optional attributable reason or decision reference for the archival.
    responses:
      - id: company_registration_result
        description: Return the attributable registration result and resulting canonical company state.
        fields:
          - {id: request_ref, description: Stable request reference for the registration attempt.}
          - {id: company_ref, description: Canonical immutable company reference.}
          - {id: company_status, description: Resulting company lifecycle state, expected to be draft on successful registration.}
          - {id: company_version, description: Registry version of the resulting company record.}
          - {id: result_disposition, description: Explicit successful, blocked, conflict, or not-checkable registration disposition.}
          - {id: limitations, description: Known limitations or unresolved evidence affecting the result.}
      - id: company_resolution_result
        description: Return the canonical company identity resolution without mutating registry state.
        fields:
          - {id: request_ref, description: Stable request reference for the resolution attempt.}
          - {id: company_ref, description: Canonical company reference resolved from the registered locator.}
          - {id: company_status, description: Current company lifecycle state.}
          - {id: company_version, description: Current registry version of the company record.}
          - {id: result_disposition, description: Explicit resolved, not-found, blocked, stale, or not-checkable disposition.}
          - {id: limitations, description: Known limitations or unresolved evidence affecting the resolution.}
      - id: company_read_result
        description: Return one canonical company registry record without mutating its state.
        fields:
          - {id: request_ref, description: Stable request reference for the read.}
          - {id: company_ref, description: Canonical company reference.}
          - {id: company_status, description: Current company lifecycle state.}
          - {id: company_version, description: Current registry version of the company record.}
          - {id: identity_descriptor_ref, description: Reference to mutable company identity attributes.}
          - {id: result_disposition, description: Explicit found, not-found, blocked, stale, or not-checkable disposition.}
          - {id: limitations, description: Known limitations or unresolved evidence affecting the read.}
      - id: company_activation_result
        description: Return the attributable activation transition result without granting execution authorization.
        fields:
          - {id: request_ref, description: Stable request reference for the activation attempt.}
          - {id: company_ref, description: Canonical company reference.}
          - {id: previous_company_status, description: Company lifecycle state before the attempted transition.}
          - {id: company_status, description: Company lifecycle state after the attempted transition.}
          - {id: company_version, description: Resulting registry version when the transition succeeds.}
          - {id: result_disposition, description: Explicit transitioned, blocked, conflict, invalid-transition, or not-checkable disposition.}
          - {id: limitations, description: Known limitations or unresolved evidence affecting the result.}
      - id: company_suspension_result
        description: Return the attributable suspension transition result without granting execution authorization.
        fields:
          - {id: request_ref, description: Stable request reference for the suspension attempt.}
          - {id: company_ref, description: Canonical company reference.}
          - {id: previous_company_status, description: Company lifecycle state before the attempted transition.}
          - {id: company_status, description: Company lifecycle state after the attempted transition.}
          - {id: company_version, description: Resulting registry version when the transition succeeds.}
          - {id: result_disposition, description: Explicit transitioned, blocked, conflict, invalid-transition, or not-checkable disposition.}
          - {id: limitations, description: Known limitations or unresolved evidence affecting the result.}
      - id: company_archival_result
        description: Return the attributable archival transition result without granting execution authorization.
        fields:
          - {id: request_ref, description: Stable request reference for the archival attempt.}
          - {id: company_ref, description: Canonical company reference.}
          - {id: previous_company_status, description: Company lifecycle state before the attempted transition.}
          - {id: company_status, description: Company lifecycle state after the attempted transition.}
          - {id: company_version, description: Resulting registry version when the transition succeeds.}
          - {id: result_disposition, description: Explicit transitioned, blocked, conflict, invalid-transition, or not-checkable disposition.}
          - {id: limitations, description: Known limitations or unresolved evidence affecting the result.}
    events:
      - {id: company_registered, description: A canonical company identity was registered with attributable request evidence.}
      - {id: company_resolved, description: A registered company locator was resolved to canonical company identity.}
      - {id: company_registry_record_read, description: A canonical company registry record was read without mutation.}
      - {id: company_activated, description: A company lifecycle transition to active completed.}
      - {id: company_suspended, description: A company lifecycle transition to suspended completed.}
      - {id: company_archived, description: A company lifecycle transition to archived completed.}
      - {id: company_registry_request_blocked, description: A registry request was blocked by invalid, missing, stale, or unauthorized evidence.}
    streams: []
  failures:
    errors:
      - {code: company_not_found, meaning: The requested canonical company identity or registered locator does not resolve to a company., retryable: false, partial_result_allowed: false}
      - {code: company_identity_conflict, meaning: The proposed company_ref or registered identity locator conflicts with an existing company identity., retryable: false, partial_result_allowed: false}
      - {code: invalid_company_state_transition, meaning: The requested lifecycle transition is not permitted from the current Company Kernel state., retryable: false, partial_result_allowed: false}
      - {code: company_version_conflict, meaning: The expected company version does not match the current authoritative registry version., retryable: true, partial_result_allowed: false}
      - {code: company_archived, meaning: The requested mutation targets an archived company that is terminal under the current Company Kernel contract., retryable: false, partial_result_allowed: false}
      - {code: company_registry_input_incomplete, meaning: Required company, request, actor, version, locator, or authority references are incomplete., retryable: false, partial_result_allowed: false}
      - {code: company_authorization_not_checkable, meaning: Required authorization evidence for a registry mutation is missing, stale, conflicting, or not verifiable., retryable: false, partial_result_allowed: false}
      - {code: company_registry_state_not_checkable, meaning: Required current company state or version evidence cannot be verified safely., retryable: true, partial_result_allowed: false}
    partial_result_policy: explicit
    unknown_or_not_checkable_policy: Registry mutations fail closed when company state, version, or authorization evidence is missing, stale, conflicting, or unverified. Read and resolution operations return an explicit blocked or not-checkable disposition and never infer a successful company identity or lifecycle state.
  state_transitions: []
  authorization:
    mode: policy_dependent
    required_for:
      - register_company
      - activate_company
      - suspend_company
      - archive_company
    permission_is_not_authority: true
    review_is_not_approval: true
    authority_reference_required: true
  idempotency:
    mode: request_key
    key_scope: request_ref_per_company_registry_operation
  observability:
    required_events:
      - company_registered
      - company_resolved
      - company_registry_record_read
      - company_activated
      - company_suspended
      - company_archived
      - company_registry_request_blocked
    correlation_fields:
      - request_ref
      - company_ref
      - actor_ref
    sensitive_fields:
      - identity_descriptor_ref
      - authorization_assessment_ref
      - transition_reason_ref
  adapter_requirements:
    contract_reference:
      require_id: true
      require_path: true
      require_version: true
    requirements:
      - preserve_company_kernel_identity_and_lifecycle_semantics
      - preserve_stable_immutable_non_recyclable_company_ref
      - never_resolve_company_identity_from_unregistered_mutable_display_attributes
      - enforce_optimistic_company_version_checks_for_lifecycle_mutations
      - require_attributable_authorization_for_registry_mutations
      - keep_reads_and_resolutions_side_effect_free
      - keep_persistence_provider_and_runtime_details_outside_the_port
      - fail_closed_on_unknown_mutation_authority_or_state
      - never_treat_registry_mutation_as_execution_authorization
  compatibility:
    policy: semver
    breaking_changes:
      - change_company_ref_identity_semantics
      - change_company_lifecycle_transition_semantics
      - add_required_registry_request_field
      - remove_attributable_authorization_requirement_for_mutations
      - allow_resolution_from_unregistered_mutable_company_attributes
      - collapse_registry_mutation_into_execution_authorization_or_approval
      - change_failure_or_not_checkable_semantics
    aliases: []
    supersedes: []
    legacy_contract_refs: []
  quality_gates:
    - company_ref_semantics_match_company_kernel
    - company_reads_and_resolutions_are_side_effect_free
    - lifecycle_mutations_require_attributable_authorization
    - unknown_mutation_authority_or_state_fails_closed
    - permission_is_not_authority
    - review_is_not_approval
    - registry_mutation_is_not_execution_authorization
    - persistence_and_runtime_implementation_remain_delegated
    - no_organization_sop_agent_or_workforce_semantics_are_redefined
