port_contract:
  id: workflow-orchestration
  kind: control_port
  version: "0.1.0"
  capability: coordinate_bounded_workflow_run_operations
  direction: bidirectional
  semantic_owner_context: method_and_workflow
  binding_owner_context: integration_and_binding
  consumer_contexts:
    - runtime_and_execution
    - evidence_evaluation_and_review
    - governance_risk_and_authority
    - product_delivery_and_registry
  purpose: >
    Trigger, coordinate, inspect, pause, resume, retry, and cancel bounded workflow
    runs through replaceable orchestration adapters while preserving WorkflowDefinition,
    ExecutionRun, review, approval, completion, delivery, and product acceptance as
    independently owned records.
  boundary:
    owns:
      - workflow_orchestration_request
      - workflow_run_reference
      - phase_and_handoff_coordination
      - retry_pause_and_cancel_record
      - orchestration_failure
    delegates:
      - workflow_definition
      - skill_method_execution
      - execution_run_recording
      - gate_evaluation
      - review
      - approval
      - completion_assessment
      - product_acceptance
    does_not_own:
      - workflow_definition_authority
      - execution_run_aggregate
      - external_tool_operation
      - review_disposition
      - approval_status
      - completion_disposition
      - product_acceptance_status
  interactions:
    requests:
      - id: start_workflow_run
        description: Start one bounded workflow run from an accepted definition, trigger, context, bindings, and applicable authorization references.
        required_fields:
          - id: request_id
            description: Stable correlation identifier for the orchestration request.
          - id: workflow_definition_ref
            description: Accepted workflow definition to coordinate.
          - id: trigger_ref
            description: Attributable trigger or accepted use-case request starting the run.
          - id: context_pack_ref
            description: Context pack available to the workflow run.
          - id: adapter_binding_ref
            description: Orchestration adapter binding selected for the run.
        optional_fields:
          - id: skill_refs
            description: Reusable methods required by workflow phases.
          - id: retry_policy_ref
            description: Retry and backoff policy applicable to failed phases.
          - id: approval_policy_ref
            description: Policy defining external approval gates and authorities.
          - id: authorization_ref
            description: Current authorization assessment when starting the workflow is governed.
      - id: control_workflow_run
        description: Inspect, pause, resume, retry, or cancel an existing workflow run using explicit preconditions.
        required_fields:
          - id: request_id
            description: Stable correlation identifier for the control request.
          - id: workflow_run_ref
            description: Workflow run being inspected or controlled.
          - id: control_operation
            description: Requested inspect, pause, resume, retry, or cancel operation.
          - id: adapter_binding_ref
            description: Orchestration adapter binding handling the control operation.
        optional_fields:
          - id: expected_phase_ref
            description: Expected current phase used for optimistic conflict detection.
          - id: failed_step_ref
            description: Failed step targeted by an authorized retry operation.
          - id: authorization_ref
            description: Current authorization reference when the control operation is governed.
    responses:
      - id: workflow_orchestration_result
        description: Return actual orchestration state, handoffs, and external evidence references without claiming workflow definition, approval, or product completion.
        fields:
          - id: request_id
            description: Correlation identifier copied from the request.
          - id: workflow_run_ref
            description: Stable reference to the coordinated workflow run.
          - id: orchestration_outcome
            description: Actual started, inspected, paused, resumed, retried, cancelled, blocked, or failed outcome.
          - id: current_phase_ref
            description: Current phase reference reported by the orchestration adapter.
          - id: completed_phase_refs
            description: Phases whose exit conditions were reported as satisfied.
          - id: failed_or_blocked_phase_refs
            description: Phases with structured failure, block, or unresolved gate state.
          - id: execution_run_refs
            description: External ExecutionRun references produced by workflow steps.
          - id: pending_gate_review_or_approval_refs
            description: External gate, review, or approval records still required by policy.
          - id: limitations
            description: Missing evidence, unsupported controls, partial outcomes, or stale orchestration state.
    events:
      - id: workflow_orchestration_requested
        description: A bounded workflow start or control request was accepted for handling.
      - id: workflow_run_started
        description: The orchestration adapter reported that an actual workflow run started.
      - id: workflow_handoff_recorded
        description: A phase handoff with required artifacts and receiver references was recorded.
      - id: workflow_orchestration_completed
        description: A terminal orchestration operation outcome was recorded.
      - id: workflow_orchestration_failed
        description: A structured orchestration failure or conflict was recorded.
    streams: []
  failures:
    errors:
      - code: invalid_workflow_orchestration_request
        meaning: Required workflow, trigger, context, adapter, or control data is missing or invalid.
        retryable: false
        partial_result_allowed: false
      - code: workflow_definition_unavailable
        meaning: The referenced workflow definition is missing, stale, incompatible, or not accepted.
        retryable: false
        partial_result_allowed: false
      - code: workflow_orchestration_unavailable
        meaning: No compatible orchestration adapter can currently handle the operation.
        retryable: true
        partial_result_allowed: false
      - code: workflow_phase_conflict
        meaning: The observed workflow phase differs from the control request precondition.
        retryable: true
        partial_result_allowed: true
      - code: workflow_step_blocked
        meaning: A required step, gate, handoff, review, approval, or execution reference is blocked or unavailable.
        retryable: true
        partial_result_allowed: true
      - code: workflow_orchestration_not_checkable
        meaning: Available evidence is insufficient to classify current workflow orchestration state.
        retryable: false
        partial_result_allowed: true
    partial_result_policy: explicit
    unknown_or_not_checkable_policy: >
      Return missing phase evidence, stale checkpoints, blocked gates, and unavailable
      execution references explicitly; never convert a workflow definition, planned step,
      waiting review, or pending approval into completed execution.
  state_transitions: []
  authorization:
    mode: policy_dependent
    required_for:
      - start_workflow
      - resume_workflow
      - retry_failed_workflow_step
      - cancel_workflow
    permission_is_not_authority: true
    review_is_not_approval: true
    authority_reference_required: true
  idempotency:
    mode: operation_defined
    key_scope: request_id_and_workflow_run
  observability:
    required_events:
      - workflow_orchestration_requested
      - workflow_run_started
      - workflow_orchestration_completed
      - workflow_orchestration_failed
    correlation_fields:
      - request_id
      - workflow_run_ref
      - workflow_definition_ref
      - adapter_binding_ref
    sensitive_fields:
      - context_pack_ref
      - authorization_ref
      - approval_policy_ref
  adapter_requirements:
    contract_reference:
      require_id: true
      require_path: true
      require_version: true
    requirements:
      - preserve_workflow_definition_and_workflow_run_separation
      - preserve_phase_transition_handoff_and_exit_condition_semantics
      - route_actual_step_execution_to_external_execution_boundaries
      - preserve_gate_review_approval_completion_and_product_acceptance_as_external_records
      - return_structured_failures_conflicts_limitations_and_correlation_references
  compatibility:
    policy: semver
    breaking_changes:
      - change_required_workflow_orchestration_input
      - change_control_operation_or_outcome_meaning
      - remove_phase_handoff_or_execution_run_references
      - weaken_retry_authorization_or_observability_semantics
      - absorb_workflow_definition_execution_review_approval_or_product_acceptance_ownership
    aliases: []
    supersedes: []
    legacy_contract_refs: []
  quality_gates:
    - workflow_definition_trigger_context_and_adapter_are_explicit
    - workflow_definition_workflow_run_and_execution_run_remain_distinct
    - phase_transitions_handoffs_and_exit_conditions_are_traceable
    - waiting_gate_review_or_approval_is_not_reported_as_completion
    - governed_control_operations_require_current_authorization
    - failures_conflicts_partial_results_and_uncheckable_state_are_explicit
