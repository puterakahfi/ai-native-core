name: Refresh port manifest once

on:
  push:
    branches:
      - 7-formalize-port-taxonomy-and-first-class-port-contracts

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install validator dependencies
        run: python3 -m pip install --disable-pip-version-check pyyaml jsonschema

      - name: Remove one-time workflow from candidate tree
        run: rm .github/workflows/refresh-port-manifest.yml

      - name: Validate contracts before manifest update
        run: |
          python3 -m py_compile \
            scripts/validate-contract-identity.py \
            scripts/validate-port-contracts.py \
            scripts/validate-port-adapter-reference.py \
            tests/test_validate_port_contracts.py \
            tests/test_validate_port_adapter_reference.py
          python3 scripts/validate-contract-identity.py
          python3 scripts/validate-port-contracts.py
          python3 scripts/validate-port-adapter-reference.py \
            tests/fixtures/port-adapter-references/valid-model-inference.port-reference.yaml
          python3 -m unittest discover -s tests -p 'test_validate_port_contracts.py' -v
          python3 -m unittest discover -s tests -p 'test_validate_port_adapter_reference.py' -v

      - name: Regenerate manifest
        run: ./scripts/generate-manifest.sh

      - name: Commit manifest and workflow deletion
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add contracts/manifest.yaml
          git add -u .github/workflows/refresh-port-manifest.yml
          git commit -m 'chore(governance): register runtime and workflow ports'
          git push origin HEAD:${{ github.ref_name }}
