name: Temporary port manifest sync

on:
  pull_request:
    types: [reopened]

permissions:
  contents: write

jobs:
  sync:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == '7-formalize-port-taxonomy-and-first-class-port-contracts'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Regenerate manifest and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/generate-manifest.sh
          rm .github/workflows/sync-port-manifest-temporary.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add contracts/manifest.yaml .github/workflows/sync-port-manifest-temporary.yml

          if git diff --cached --quiet; then
            echo 'No manifest or cleanup change to commit.'
            exit 0
          fi

          git commit -m 'chore(governance): sync final port contract manifest'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
