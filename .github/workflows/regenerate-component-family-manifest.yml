name: Regenerate component family manifest

on:
  push:
    branches:
      - 37-component-family-design-contract
    paths:
      - .github/workflows/regenerate-component-family-manifest.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 37-component-family-design-contract
          fetch-depth: 0

      - name: Run canonical manifest generator
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/generate-manifest.sh

      - name: Commit generated manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add contracts/manifest.yaml
          git commit -m 'chore(contracts): regenerate manifest'
          git push origin HEAD:37-component-family-design-contract
