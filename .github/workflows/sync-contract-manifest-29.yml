name: Sync refined contract manifest

on:
  push:
    branches:
      - 29-refine-implementation-context-component-coverage
    paths:
      - .github/workflows/sync-contract-manifest-29.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 29-refine-implementation-context-component-coverage
          fetch-depth: 0

      - name: Generate manifest
        run: ./scripts/generate-manifest.sh

      - name: Commit canonical manifest
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- contracts/manifest.yaml; then
            echo 'Manifest already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add contracts/manifest.yaml
          git commit -m 'chore(governance): sync component coverage manifest'
          git push origin HEAD:29-refine-implementation-context-component-coverage
