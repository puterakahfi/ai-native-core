name: Temporary contract schema v1 migration

on:
  push:
    branches:
      - 8-unify-contract-schemas-and-workflow-contracts

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install migration dependencies
        run: python3 -m pip install --disable-pip-version-check pyyaml

      - name: Materialize schema identity and workflow migration
        run: |
          python3 scripts/materialize-contract-schema-v1.py
          python3 scripts/generate-manifest.py

      - name: Remove one-time migration artifacts
        run: |
          rm scripts/materialize-contract-schema-v1.py
          rm .github/workflows/tmp-contract-schema-v1-migration.yml

      - name: Commit controlled migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(schemas): materialize schema identities and workflow migration'
          git push
