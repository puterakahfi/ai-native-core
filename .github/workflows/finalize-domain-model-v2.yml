name: Finalize Canonical Domain Model V2

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/finalize-domain-model-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install validation dependency
        run: python -m pip install "PyYAML>=6,<7"

      - name: Promote accepted domain authority idempotently
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "docs/domain-model/README.md": [
                  ("Status: Proposed canonical source of truth for issue `#6`", "Status: Canonical source of truth"),
                  (
                      "## 8. Acceptance status\n\nThis entry point remains proposed until issue `#6` completes:\n\n- philosophy-to-domain traceability review;\n- bounded-context and ownership review;\n- object, aggregate, policy, event, and invariant review;\n- lifecycle and status contradiction review;\n- contract inventory mapping;\n- architecture and glossary reconciliation;\n- relative-link and applicable documentation validation;\n- explicit owner acceptance or requested revision.",
                      "## 8. Acceptance record\n\nThis domain model is accepted as the canonical runtime-agnostic Native AI Engineering object, relationship, lifecycle, and ownership authority through issue `#6`.\n\nAcceptance evidence is recorded in [`acceptance-review.md`](acceptance-review.md). The model preserves the philosophy foundation, maps the current contract inventory, reconciles active architecture and glossary navigation, and leaves port taxonomy, schema shape, validator-v2 semantics, runtime implementation, and product specialization to their named downstream owners.\n\nKnown follow-up issue `#26` owns the compatibility-governed correction of legacy Development Loop review/approval and documentation-shortcut wording. That follow-up does not change this model's canonical distinction between `ReviewResult` and authority-bearing `Approval`.",
                  ),
              ],
              "docs/domain-model/bounded-contexts.md": [
                  ("Status: Proposed canonical context map for issue `#6`", "Status: Canonical context map"),
              ],
              "docs/domain-model/domain-objects.md": [
                  ("Status: Proposed canonical object model for issue `#6`", "Status: Canonical object model"),
              ],
              "docs/domain-model/lifecycle-and-status.md": [
                  ("Status: Proposed canonical lifecycle model for issue `#6`", "Status: Canonical lifecycle and status model"),
              ],
              "docs/domain-model/ownership-and-dependencies.md": [
                  ("Status: Proposed canonical ownership model for issue `#6`", "Status: Canonical ownership and dependency model"),
              ],
              "docs/domain-model/philosophy-traceability.md": [
                  ("Status: Proposed acceptance evidence for issue `#6`", "Status: Canonical philosophy-to-domain traceability record"),
              ],
              "docs/domain-model/reconciliation.md": [
                  ("Status: Proposed cross-document reconciliation for issue `#6`", "Status: Canonical cross-document reconciliation record"),
              ],
              "docs/domain-model/acceptance-review.md": [
                  ("Status: Final review evidence for issue `#6`", "Status: Accepted final review evidence"),
                  (
                      "Recommendation: promote `docs/domain-model/README.md` and supporting documents from proposed status to canonical status, complete final documentation validation, and request owner acceptance of issue `#6`.",
                      "Acceptance decision: promote `docs/domain-model/README.md` and supporting documents to canonical status. Final documentation validation and owner-authorized merge complete the issue `#6` acceptance boundary.",
                  ),
              ],
          }

          for path, pairs in replacements.items():
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              for old, new in pairs:
                  if old in text:
                      text = text.replace(old, new, 1)
                  elif new not in text:
                      raise SystemExit(f"{path}: neither old nor accepted text exists: {old!r}")
              file.write_text(text, encoding="utf-8")
          PY

      - name: Validate canonical domain model acceptance
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import yaml

          root = Path.cwd()
          domain = root / "docs/domain-model"
          errors = []

          for file in sorted(domain.glob("*.md")):
              text = file.read_text(encoding="utf-8")
              if "Status: Proposed" in text:
                  errors.append(f"{file.relative_to(root)} still has proposed status")

          required_status = {
              "README.md": "Status: Canonical source of truth",
              "bounded-contexts.md": "Status: Canonical context map",
              "domain-objects.md": "Status: Canonical object model",
              "lifecycle-and-status.md": "Status: Canonical lifecycle and status model",
              "ownership-and-dependencies.md": "Status: Canonical ownership and dependency model",
              "philosophy-traceability.md": "Status: Canonical philosophy-to-domain traceability record",
              "reconciliation.md": "Status: Canonical cross-document reconciliation record",
              "acceptance-review.md": "Status: Accepted final review evidence",
          }
          for name, marker in required_status.items():
              if marker not in (domain / name).read_text(encoding="utf-8"):
                  errors.append(f"{name}: missing accepted status")

          contexts = [
              "Intent & Specification", "Capability & Agreement", "Method & Workflow",
              "Integration & Binding", "Runtime & Execution", "Context, Knowledge & Memory",
              "Evidence, Evaluation & Review", "Governance, Risk & Authority",
              "Product, Delivery & Registry", "Learning & Evolution",
          ]
          bounded = (domain / "bounded-contexts.md").read_text(encoding="utf-8")
          errors.extend(f"missing context: {name}" for name in contexts if name not in bounded)

          status_families = [
              "EpistemicDisposition", "SpecificationStatus", "ContractStatus", "BindingStatus",
              "CapacityDisposition", "ExecutionStatus", "GateOutcome", "ReviewDisposition",
              "ApprovalStatus", "CompletionDisposition", "DeliveryStatus",
              "ProductAcceptanceStatus", "EvolutionStatus",
          ]
          lifecycle = (domain / "lifecycle-and-status.md").read_text(encoding="utf-8")
          errors.extend(f"missing status family: {name}" for name in status_families if name not in lifecycle)

          trace = (domain / "philosophy-traceability.md").read_text(encoding="utf-8")
          for marker in [
              "Axiom 1 — Attributable Observation",
              "Axiom 2 — State–Representation Separation",
              "Bridge Law — Feedback And Governed Evolution",
              "Review–Approval Separation",
              "No local redefinition of core",
          ]:
              if marker not in trace:
                  errors.append(f"missing philosophy trace: {marker}")

          acceptance = (domain / "acceptance-review.md").read_text(encoding="utf-8")
          for marker in [
              "First-class concept ownership audit",
              "Contract inventory mapping",
              "108 contract artifacts",
              "PASS WITH FOLLOW-UP #26",
              "Acceptance decision: promote",
          ]:
              if marker not in acceptance:
                  errors.append(f"acceptance review missing: {marker}")

          manifest = yaml.safe_load((root / "contracts/manifest.yaml").read_text(encoding="utf-8"))
          if manifest.get("total_contracts") != 108:
              errors.append(f"manifest total changed: {manifest.get('total_contracts')}")

          markdown_files = [root / "README.md", *sorted((root / "docs").rglob("*.md"))]
          link_pattern = re.compile(r"(?<!!)\[[^\]]+\]\(([^)]+)\)")
          for file in markdown_files:
              for target in link_pattern.findall(file.read_text(encoding="utf-8")):
                  target = target.strip().split()[0].strip("<>")
                  if not target or target.startswith(("http://", "https://", "mailto:", "#")):
                      continue
                  relative = target.split("#", 1)[0].split("?", 1)[0]
                  if not relative:
                      continue
                  resolved = (file.parent / relative).resolve()
                  try:
                      resolved.relative_to(root.resolve())
                  except ValueError:
                      errors.append(f"{file.relative_to(root)}: link escapes repository: {target}")
                      continue
                  if not resolved.exists():
                      errors.append(f"{file.relative_to(root)}: missing link target: {target}")

          for file in markdown_files:
              text = file.read_text(encoding="utf-8")
              for marker in [
                  "Canonical domain-model work: issue `#6`",
                  "issue `#6` remains authoritative once accepted",
                  "Status: Proposed canonical",
              ]:
                  if marker in text:
                      errors.append(f"{file.relative_to(root)}: stale marker: {marker}")

          if errors:
              raise SystemExit("\n".join(errors))
          print("canonical domain model acceptance validation passed")
          PY

          changed=$(git diff --name-only origin/main...HEAD)
          if printf '%s\n' "$changed" | grep -E '^(contracts/|schemas/|scripts/)'; then
            echo "Issue #6 must not change contracts, schemas, manifest, or tooling" >&2
            exit 1
          fi
          git diff --check

      - name: Commit canonical status when changed
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          if git diff --quiet -- docs/domain-model; then
            echo "Canonical status already committed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/domain-model
          git commit -m "docs: accept canonical Native AI Engineering domain model [skip ci]"
          git push origin HEAD:${HEAD_BRANCH}
