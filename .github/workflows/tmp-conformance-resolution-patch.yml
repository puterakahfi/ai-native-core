name: Temporary conformance resolution patch

on:
  push:
    branches:
      - 8-unify-contract-schemas-and-workflow-contracts

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch conformance resolver
        run: python3 scripts/patch-conformance-contract-resolution.py
      - name: Compile patched tooling
        run: |
          python3 -m py_compile \
            scripts/contract_resolution.py \
            scripts/validate-conformance.py \
            scripts/validate-implements.py
      - name: Remove one-time artifacts and commit
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/patch-conformance-contract-resolution.py
          rm .github/workflows/tmp-conformance-resolution-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(conformance): resolve canonical contract families'
          git push
