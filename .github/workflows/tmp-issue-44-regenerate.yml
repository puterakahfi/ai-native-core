name: Temporary issue 44 regenerate

on:
  pull_request:
    branches: [main]
    paths:
      - contracts/skills/design/visual-hierarchy.contract.yaml
      - .github/workflows/tmp-issue-44-regenerate.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout issue branch
        uses: actions/checkout@v4
        with:
          ref: 44-refine-composition-visual-hierarchy-contracts
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python3 -m pip install --disable-pip-version-check pyyaml jsonschema

      - name: Regenerate and validate
        run: |
          set -euo pipefail
          ./scripts/generate-manifest.sh
          python3 scripts/inventory-contract-schemas.py
          python3 scripts/validate-contract-schemas.py
          python3 scripts/validate-contract-identity.py
          python3 scripts/validate-port-contracts.py
          python3 scripts/run-eval.py --all --validate-tests
          python3 -m unittest discover -s tests -p 'test_validate_contract_schemas.py' -v
          python3 -m unittest discover -s tests -p 'test_contract_resolution.py' -v
          python3 -m unittest discover -s tests -p 'test_validate_port_contracts.py' -v
          python3 -m unittest discover -s tests -p 'test_port_inventory.py' -v
          python3 -m unittest discover -s tests -p 'test_validate_port_adapter_reference.py' -v
          python3 scripts/inventory-contract-schemas.py --check
          grep -q 'heuristics_may_expose_ambiguity_or_accidental_competition' contracts/skills/design/visual-hierarchy.contract.yaml
          ! grep -q 'heuristics_may_expose_ambiguity_or accidental_competition' contracts/skills/design/visual-hierarchy.contract.yaml

      - name: Commit regenerated metadata and remove workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-issue-44-regenerate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(design): refresh issue 44 generated metadata'
          git push origin HEAD:44-refine-composition-visual-hierarchy-contracts
