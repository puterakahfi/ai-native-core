name: Temporary schema discovery v2

on:
  push:
    branches:
      - 8-unify-contract-schemas-and-workflow-contracts

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install discovery dependencies
        run: python3 -m pip install --disable-pip-version-check pyyaml

      - name: Generate deterministic contract and manifest inventory
        run: python3 scripts/inventory-contract-schemas.py

      - name: Remove temporary workflow and commit discovery
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-schema-discovery-v2.yml
          python3 scripts/inventory-contract-schemas.py --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/contract-schema-discovery.yaml .github/workflows/tmp-schema-discovery-v2.yml
          git commit -m 'docs(schemas): refresh contract and manifest inventory'
          git push
