name: Temporary workflow schema corrections

on:
  push:
    branches:
      - 8-unify-contract-schemas-and-workflow-contracts

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install correction dependencies
        run: python3 -m pip install --disable-pip-version-check pyyaml
      - name: Apply workflow corrections and regenerate manifest
        run: |
          python3 scripts/fix-workflow-schema-migration.py
          python3 scripts/generate-manifest.py
      - name: Remove one-time artifacts and commit
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/fix-workflow-schema-migration.py
          rm .github/workflows/tmp-workflow-schema-corrections.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(workflows): reconcile schema migration data'
          git push
