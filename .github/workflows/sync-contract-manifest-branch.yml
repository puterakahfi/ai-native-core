name: Sync contract manifest on branch

on:
  push:
    branches:
      - 14-add-collection-discovery-contract

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 14-add-collection-discovery-contract
          fetch-depth: 0

      - name: Generate and commit canonical manifest
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/generate-manifest.sh
          if git diff --quiet -- contracts/manifest.yaml; then
            echo 'Manifest already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add contracts/manifest.yaml
          git commit -m 'chore(governance): sync contract manifest'
          git push origin HEAD:14-add-collection-discovery-contract
