name: Temporary contract metadata sync

on:
  push:
    branches:
      - 50-engineering-design-quality-contracts

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install generator dependencies
        run: python3 -m pip install --disable-pip-version-check pyyaml jsonschema

      - name: Regenerate governed contract metadata
        run: |
          ./scripts/generate-manifest.sh
          python3 scripts/inventory-contract-schemas.py

      - name: Commit generated metadata
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- contracts/manifest.yaml docs/contract-schema-discovery.yaml; then
            echo 'Generated metadata already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add contracts/manifest.yaml docs/contract-schema-discovery.yaml
          git commit -m 'chore(governance): sync engineering quality contract metadata'
          git push
