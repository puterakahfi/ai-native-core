name: Temporary schema navigation docs patch

on:
  push:
    branches:
      - 8-unify-contract-schemas-and-workflow-contracts

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch navigation documentation
        run: python3 scripts/patch-schema-navigation-docs.py
      - name: Remove one-time artifacts and commit
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/patch-schema-navigation-docs.py
          rm .github/workflows/tmp-patch-schema-navigation-docs.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs(schemas): align visitor and contributor navigation'
          git push
