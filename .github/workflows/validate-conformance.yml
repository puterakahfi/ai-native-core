name: Validate Conformance Tooling

on:
  pull_request:
    paths:
      - "scripts/validate-conformance.py"
      - "tests/test_validate_conformance.py"
      - "tests/fixtures/conformance-boundaries/**"
      - ".github/workflows/validate-conformance.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/validate-conformance.py"
      - "tests/test_validate_conformance.py"
      - "tests/fixtures/conformance-boundaries/**"
      - ".github/workflows/validate-conformance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Compile validator and tests
        run: |
          python -m py_compile \
            scripts/validate-conformance.py \
            tests/test_validate_conformance.py

      - name: Run validator regression tests
        run: python -m unittest discover -s tests -v
