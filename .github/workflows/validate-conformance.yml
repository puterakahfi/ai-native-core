name: Validate Conformance Tooling

on:
  pull_request:
    paths:
      - "contracts/manifest.yaml"
      - "contracts/compatibility/**"
      - "docs/contract-schema-*.md"
      - "scripts/contract_resolution.py"
      - "scripts/validate-conformance.py"
      - "scripts/validate-implements.py"
      - "scripts/validate-implements.sh"
      - "tests/test_validate_conformance.py"
      - "tests/test_contract_resolution.py"
      - "tests/fixtures/conformance-boundaries/**"
      - ".github/workflows/validate-conformance.yml"
  push:
    branches:
      - main
    paths:
      - "contracts/manifest.yaml"
      - "contracts/compatibility/**"
      - "docs/contract-schema-*.md"
      - "scripts/contract_resolution.py"
      - "scripts/validate-conformance.py"
      - "scripts/validate-implements.py"
      - "scripts/validate-implements.sh"
      - "tests/test_validate_conformance.py"
      - "tests/test_contract_resolution.py"
      - "tests/fixtures/conformance-boundaries/**"
      - ".github/workflows/validate-conformance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Compile resolver, validators, and tests
        run: |
          python -m py_compile \
            scripts/contract_resolution.py \
            scripts/validate-conformance.py \
            scripts/validate-implements.py \
            tests/test_validate_conformance.py \
            tests/test_contract_resolution.py

      - name: Run conformance regression tests
        id: regressions
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            python -m unittest discover -s tests -p 'test_validate_conformance.py' -v
            python -m unittest discover -s tests -p 'test_contract_resolution.py' -v
          } > /tmp/conformance-regressions.log 2>&1
          status=$?
          tail -n 120 /tmp/conformance-regressions.log
          exit "$status"

      - name: Upload conformance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-regressions-${{ github.run_id }}
          path: /tmp/conformance-regressions.log
          if-no-files-found: error

      - name: Enforce regression result
        if: steps.regressions.outcome == 'failure'
        run: exit 1
