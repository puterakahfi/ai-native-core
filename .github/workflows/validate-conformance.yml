name: Validate Conformance Tooling

on:
  pull_request:
    paths:
      - "contracts/manifest.yaml"
      - "contracts/compatibility/**"
      - "docs/adapter-conformance.md"
      - "docs/structured-adapter-conformance-discovery.md"
      - "schemas/adapter-conformance.schema.yaml"
      - "schemas/conformance-report.schema.yaml"
      - "schemas/common.schema.yaml"
      - "scripts/contract_resolution.py"
      - "scripts/conformance_validation.py"
      - "scripts/conformance_semantics.py"
      - "scripts/conformance_taxonomy.py"
      - "scripts/validate-conformance.py"
      - "scripts/validate-implements.py"
      - "scripts/validate-implements.sh"
      - "tests/test_validate_conformance.py"
      - "tests/test_contract_resolution.py"
      - "tests/fixtures/conformance-boundaries/**"
      - ".github/workflows/validate-conformance.yml"
  push:
    branches:
      - main
    paths:
      - "contracts/manifest.yaml"
      - "contracts/compatibility/**"
      - "docs/adapter-conformance.md"
      - "docs/structured-adapter-conformance-discovery.md"
      - "schemas/adapter-conformance.schema.yaml"
      - "schemas/conformance-report.schema.yaml"
      - "schemas/common.schema.yaml"
      - "scripts/contract_resolution.py"
      - "scripts/conformance_validation.py"
      - "scripts/conformance_semantics.py"
      - "scripts/conformance_taxonomy.py"
      - "scripts/validate-conformance.py"
      - "scripts/validate-implements.py"
      - "scripts/validate-implements.sh"
      - "tests/test_validate_conformance.py"
      - "tests/test_contract_resolution.py"
      - "tests/fixtures/conformance-boundaries/**"
      - ".github/workflows/validate-conformance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout core
        uses: actions/checkout@v4

      - name: Checkout executable adapters
        uses: actions/checkout@v4
        with:
          repository: puterakahfi/ai-native-skills
          path: ai-native-skills

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check PyYAML jsonschema

      - name: Compile resolver, schemas, validators, and tests
        run: |
          python -m py_compile \
            scripts/contract_resolution.py \
            scripts/schema_validation.py \
            scripts/conformance_validation.py \
            scripts/conformance_semantics.py \
            scripts/conformance_taxonomy.py \
            scripts/validate-conformance.py \
            scripts/validate-implements.py \
            tests/test_validate_conformance.py \
            tests/test_contract_resolution.py

      - name: Run conformance regression tests
        id: regressions
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
            python -m unittest discover -s tests -p 'test_validate_conformance.py' -v
            python -m unittest discover -s tests -p 'test_contract_resolution.py' -v
          } > /tmp/conformance-regressions.log 2>&1
          status=$?
          tail -n 200 /tmp/conformance-regressions.log
          exit "$status"

      - name: Generate repository migration inventory
        id: migration_inventory
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python scripts/validate-conformance.py \
            . \
            ai-native-skills \
            --mode migration \
            --output-dir /tmp/conformance-reports \
            --format json \
            > /tmp/conformance-inventory.log 2>&1
          status=$?
          tail -n 200 /tmp/conformance-inventory.log
          exit "$status"

      - name: Upload conformance diagnostics and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: structured-conformance-${{ github.run_id }}
          path: |
            /tmp/conformance-regressions.log
            /tmp/conformance-inventory.log
            /tmp/conformance-reports
          if-no-files-found: warn

      - name: Enforce regression result
        if: steps.regressions.outcome == 'failure'
        run: exit 1

      - name: Enforce explicit migration errors
        if: steps.migration_inventory.outcome == 'failure'
        run: exit 1
