name: Temporary port batch 3 validation

on:
  pull_request:
    types: [reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        run: python3 -m pip install --disable-pip-version-check pyyaml jsonschema

      - name: Materialize remaining contracts
        run: |
          python3 scripts/materialize-port-batch-3.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/test_validate_port_contracts.py')
          text = path.read_text(encoding='utf-8')
          if 'PASS — 10 port contract(s)' in text:
              text = text.replace('PASS — 10 port contract(s)', 'PASS — 31 port contract(s)')
          elif 'PASS — 31 port contract(s)' not in text:
              raise SystemExit('port-count assertion anchor not found')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Compile validators and tests
        run: |
          python3 -m py_compile \
            scripts/validate-contract-identity.py \
            scripts/validate-port-contracts.py \
            scripts/validate-port-adapter-reference.py \
            tests/test_validate_port_contracts.py \
            tests/test_validate_port_adapter_reference.py

      - name: Validate canonical contract identity
        run: python3 scripts/validate-contract-identity.py

      - name: Validate all first-class port contracts
        run: python3 scripts/validate-port-contracts.py

      - name: Validate compatible adapter reference
        run: >-
          python3 scripts/validate-port-adapter-reference.py
          tests/fixtures/port-adapter-references/valid-model-inference.port-reference.yaml

      - name: Run regression tests
        run: |
          python3 -m unittest discover -s tests -p 'test_validate_port_contracts.py' -v
          python3 -m unittest discover -s tests -p 'test_validate_port_adapter_reference.py' -v

      - name: Regenerate manifest
        run: ./scripts/generate-manifest.sh

      - name: Verify generated tree
        run: |
          test "$(find contracts/ports -name '*.port.yaml' | wc -l | tr -d ' ')" = "31"
          grep -q 'total_contracts: 141' contracts/manifest.yaml
          git diff --check

      - name: Remove temporary materialization artifacts
        run: |
          rm scripts/materialize-port-batch-3.py
          rm .github/workflows/tmp-port-batch-3-validation.yml

      - name: Commit validated batch
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contracts/ports contracts/manifest.yaml tests/test_validate_port_contracts.py
          git add -u scripts/materialize-port-batch-3.py .github/workflows/tmp-port-batch-3-validation.yml
          git commit -m "feat(ports): migrate remaining active port contracts"
          git push origin HEAD:${HEAD_BRANCH}
