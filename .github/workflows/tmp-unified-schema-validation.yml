name: Temporary unified schema validation

on:
  push:
    branches:
      - 8-unify-contract-schemas-and-workflow-contracts
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install validation dependencies
        run: python3 -m pip install --disable-pip-version-check pyyaml jsonschema
      - name: Compile schema tooling
        run: |
          python3 -m py_compile \
            scripts/schema_validation.py \
            scripts/generate-manifest.py \
            scripts/validate-contract-schemas.py \
            scripts/validate-port-contracts.py \
            tests/test_validate_contract_schemas.py
      - name: Validate unified contract schemas
        id: unified
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/validate-contract-schemas.py > /tmp/schema-validation.log 2>&1
          status=$?
          tail -n 100 /tmp/schema-validation.log
          exit "$status"
      - name: Upload unified validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-validation-${{ github.run_id }}
          path: /tmp/schema-validation.log
          if-no-files-found: error
      - name: Enforce unified validation result
        if: steps.unified.outcome == 'failure'
        run: exit 1
      - name: Run unified contract regression tests
        run: python3 -m unittest discover -s tests -p 'test_validate_contract_schemas.py' -v
      - name: Validate port semantic regressions
        run: python3 scripts/validate-port-contracts.py
      - name: Validate behavioral test contracts
        run: python3 scripts/run-eval.py --all --validate-tests
      - name: Verify manifest determinism
        run: |
          cp contracts/manifest.yaml /tmp/manifest.yaml
          ./scripts/generate-manifest.sh
          diff -u /tmp/manifest.yaml contracts/manifest.yaml
