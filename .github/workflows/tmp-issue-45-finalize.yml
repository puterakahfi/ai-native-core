name: Temporary issue 45 finalize

on:
  pull_request:
    branches: [main]
    paths:
      - contracts/skills/quality/design-audit.contract.yaml
      - contracts/skills/design/image-prompt-engineering.contract.yaml
      - contracts/workflows/skill-maintenance.contract.yaml
      - contracts/tests/design-audit.test.yaml
      - contracts/tests/image-prompt-engineering.test.yaml
      - contracts/tests/skill-maintenance.test.yaml
      - docs/missing-capability-contracts-migration.yaml
      - .github/workflows/tmp-issue-45-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout issue branch
        uses: actions/checkout@v4
        with:
          ref: 45-define-design-audit-image-prompt-skill-maintenance-contracts
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python3 -m pip install --disable-pip-version-check pyyaml jsonschema

      - name: Regenerate canonical metadata
        run: |
          ./scripts/generate-manifest.sh
          python3 scripts/inventory-contract-schemas.py

      - name: Validate repository contracts
        run: |
          set -euo pipefail
          python3 scripts/validate-contract-schemas.py
          python3 scripts/validate-contract-identity.py
          python3 scripts/validate-port-contracts.py
          python3 scripts/validate-port-adapter-reference.py tests/fixtures/port-adapter-references/valid-model-inference.port-reference.yaml
          python3 scripts/run-eval.py --all --validate-tests
          python3 -m unittest discover -s tests -p 'test_validate_contract_schemas.py' -v
          python3 -m unittest discover -s tests -p 'test_contract_resolution.py' -v
          python3 -m unittest discover -s tests -p 'test_validate_port_contracts.py' -v
          python3 -m unittest discover -s tests -p 'test_port_inventory.py' -v
          python3 -m unittest discover -s tests -p 'test_validate_port_adapter_reference.py' -v
          python3 scripts/inventory-contract-schemas.py --check

      - name: Assert issue 45 boundaries
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import yaml

          root = Path('.')
          design_audit = yaml.safe_load((root / 'contracts/skills/quality/design-audit.contract.yaml').read_text())['skill_contract']
          image_prompt = yaml.safe_load((root / 'contracts/skills/design/image-prompt-engineering.contract.yaml').read_text())['skill_contract']
          maintenance_doc = yaml.safe_load((root / 'contracts/workflows/skill-maintenance.contract.yaml').read_text())
          maintenance = maintenance_doc['workflow_contract']
          manifest = yaml.safe_load((root / 'contracts/manifest.yaml').read_text())

          assert design_audit['id'] == 'design-audit'
          assert design_audit['version'] == '1.0.0'
          assert 'design_review_retains_gate_identity_routing_scoring_coverage_and_verdict_authority' in design_audit['quality_gates']
          assert 'redesign_or_implementation_output' in design_audit['boundary']['does_not_cover']

          assert image_prompt['id'] == 'image-prompt-engineering'
          assert image_prompt['version'] == '1.0.0'
          image_text = (root / 'contracts/skills/design/image-prompt-engineering.contract.yaml').read_text().lower()
          for forbidden in ('dall-e', 'midjourney', 'stable diffusion', 'flux', '--ar', '300 characters', '1.4'):
              assert forbidden not in image_text, forbidden
          assert 'provider_syntax_limits_and_weighting_rules_are_adapter_owned' in image_prompt['quality_gates']
          assert 'model_inference_or_image_generation' in image_prompt['boundary']['does_not_cover']

          assert maintenance_doc['contract_schema']['kind'] == 'workflow_contract'
          assert maintenance['id'] == 'skill-maintenance'
          assert maintenance['workflow_kind'] == 'quality_lifecycle'
          assert [phase['id'] for phase in maintenance['phases']] == ['audit', 'triage', 'repair', 'verify', 'report']
          maintenance_text = (root / 'contracts/workflows/skill-maintenance.contract.yaml').read_text().lower()
          for forbidden in ('200 lines', 'first 20', 'last 10', 'pass: >=', 'health score'):
              assert forbidden not in maintenance_text, forbidden
          assert 'repository_specific_numeric_thresholds_remain_diagnostic_not_universal' in maintenance['quality_gates']
          assert 'behavioral_application_verdict_owned_by_skill_eval' in maintenance['boundary']['does_not_cover']
          assert 'generalized_learning_promotion_owned_by_skill_evolution' in maintenance['boundary']['does_not_cover']

          expected = {
              ('skill_contract', 'design-audit', 'contracts/skills/quality/design-audit.contract.yaml'),
              ('skill_contract', 'image-prompt-engineering', 'contracts/skills/design/image-prompt-engineering.contract.yaml'),
              ('workflow_contract', 'skill-maintenance', 'contracts/workflows/skill-maintenance.contract.yaml'),
              ('behavioral_test_contract', 'design-audit', 'contracts/tests/design-audit.test.yaml'),
              ('behavioral_test_contract', 'image-prompt-engineering', 'contracts/tests/image-prompt-engineering.test.yaml'),
              ('behavioral_test_contract', 'skill-maintenance', 'contracts/tests/skill-maintenance.test.yaml'),
          }
          found = set()
          def walk(value):
              if isinstance(value, dict):
                  if {'id', 'kind', 'path'} <= value.keys():
                      found.add((value['kind'], value['id'], value['path']))
                  for child in value.values():
                      walk(child)
              elif isinstance(value, list):
                  for child in value:
                      walk(child)
          walk(manifest.get('contracts', {}))
          missing = expected - found
          assert not missing, sorted(missing)

          migration = yaml.safe_load((root / 'docs/missing-capability-contracts-migration.yaml').read_text())['missing_capability_contracts_migration']
          assert migration['downstream_consumer']['mapping']['prompt-engineer']['contract_id'] == 'image-prompt-engineering'
          assert migration['downstream_consumer']['mapping']['skill-doctor']['contract_id'] == 'skill-maintenance'
          print('PASS — issue 45 canonical families, boundaries, counterexamples, and migration are explicit.')
          PY

      - name: Commit generated metadata and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-issue-45-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add contracts/manifest.yaml docs/contract-schema-discovery.yaml .github/workflows/tmp-issue-45-finalize.yml
          if git diff --cached --quiet; then
            echo 'No generated metadata changes to commit.'
            exit 0
          fi
          git commit -m 'chore(governance): register issue 45 contracts'
          git push origin HEAD:45-define-design-audit-image-prompt-skill-maintenance-contracts
