name: Apply Domain Model Reconciliation

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/apply-domain-model-reconciliation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Apply reviewed navigation and authority reconciliation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path.cwd()

          def replace(path: str, old: str, new: str, count: int = 1) -> None:
              file = root / path
              text = file.read_text(encoding="utf-8")
              actual = text.count(old)
              if actual < count:
                  raise SystemExit(f"{path}: expected at least {count} occurrence(s), found {actual}: {old!r}")
              text = text.replace(old, new, count)
              file.write_text(text, encoding="utf-8")

          # README navigation and domain authority.
          replace(
              "README.md",
              "| Understanding the Native AI Engineering decision foundation | [Philosophy foundation](docs/philosophy/README.md) |\n| Reading the framework architecture | [Architecture v0.2](docs/architecture-v0.2.md) |",
              "| Understanding the Native AI Engineering decision foundation | [Philosophy foundation](docs/philosophy/README.md) |\n| Understanding the canonical Native AI Engineering domain model | [Canonical domain model](docs/domain-model/README.md) |\n| Reading the framework architecture | [Architecture v0.2](docs/architecture-v0.2.md) |",
          )
          replace(
              "README.md",
              "See the [philosophy foundation](docs/philosophy/README.md), [Architecture v0.2](docs/architecture-v0.2.md), [ports and adapters](docs/ports-and-adapters.md), and [port taxonomy](docs/port-taxonomy.md) for the complete framework model and authority boundaries.",
              "See the [philosophy foundation](docs/philosophy/README.md), [canonical domain model](docs/domain-model/README.md), [Architecture v0.2](docs/architecture-v0.2.md), [ports and adapters](docs/ports-and-adapters.md), and [port taxonomy](docs/port-taxonomy.md) for the complete framework model and authority boundaries.",
          )
          replace(
              "README.md",
              "- [Architecture v0.2](docs/architecture-v0.2.md)\n- [Domain-driven model](docs/domain-driven-model.md)",
              "- [Canonical Native AI Engineering domain model](docs/domain-model/README.md)\n- [Architecture v0.2](docs/architecture-v0.2.md)\n- [Domain-driven modeling guide](docs/domain-driven-model.md)",
          )

          # Operational architecture remains a view, not domain ownership authority.
          replace(
              "docs/architecture-v0.2.md",
              "Canonical domain-model work: issue `#6`",
              "Canonical domain model: [`domain-model/README.md`](domain-model/README.md)",
          )
          replace(
              "docs/architecture-v0.2.md",
              "This document explains an operational architecture model. It is not the philosophy kernel, not the final canonical Native AI Engineering domain model, and not a universal numbering authority for every repository artifact.",
              "This document explains an operational architecture model. It is not the philosophy kernel, does not redefine the canonical Native AI Engineering domain model, and is not a universal numbering authority for every repository artifact.",
          )
          replace(
              "docs/architecture-v0.2.md",
              "This sequence is an operational dependency view. It must not compete with:",
              "This sequence is an operational dependency view, not a bounded-context map. It must not compete with:",
          )
          replace(
              "docs/architecture-v0.2.md",
              "the canonical domain model owned by issue #6;",
              "the [canonical domain model](domain-model/README.md);",
          )
          replace(
              "docs/architecture-v0.2.md",
              "The complete canonical Native AI Engineering domain model remains owned by issue `#6`.",
              "Canonical Native AI Engineering objects, contexts, lifecycle semantics, and ownership are defined by the [canonical domain model](domain-model/README.md).",
          )

          # DDD document becomes an explicit guide with illustrative product examples.
          replace(
              "docs/domain-driven-model.md",
              "# Domain-Driven Model\n\n## Purpose\n\nThis document defines how Native AI Framework uses domain-driven modeling to keep product logic stable while tools, models, frameworks, and providers change.",
              "# Domain-Driven Modeling Guide\n\nStatus: Modeling guide with non-normative product examples\n\nCanonical Native AI Engineering domain model: [`domain-model/README.md`](domain-model/README.md)\n\n## Purpose\n\nThis document explains how products use domain-driven modeling to keep product logic stable while tools, models, frameworks, and providers change. It is a guide, not the canonical Native AI Engineering domain model.",
          )
          replace(
              "docs/domain-driven-model.md",
              "ExampleProduct core domain = Creative Control",
              "Illustrative product core domain = Creative Control",
          )
          replace(
              "docs/domain-driven-model.md",
              "## ExampleProduct Example",
              "## Illustrative Product Example",
          )
          replace(
              "docs/domain-driven-model.md",
              "Wrong:\n\n```text\nExampleProduct is an image generation app.\n```\n\nBetter:\n\n```text\nExampleProduct is a creative control system.\n```",
              "The following example is product-specific and non-normative.\n\nWrong:\n\n```text\nExampleProduct is an image generation app.\n```\n\nBetter:\n\n```text\nExampleProduct is a creative control system.\n```",
          )

          # Engineering Contract is a product/repository specialization.
          replace(
              "docs/engineering-contract.md",
              "# Engineering Contract\n\n## Problem",
              "# Product And Repository Engineering Contract Guide\n\nStatus: Product/repository policy specialization\n\nCanonical contract and ownership meanings: [`domain-model/README.md`](domain-model/README.md)\n\nAn Engineering Contract in this document is a product- or repository-owned specialization that defines implementation ecosystem and engineering policy. It does not replace the universal `Contract` meaning or silently override accepted core agreements.\n\n## Problem",
          )
          replace(
              "docs/engineering-contract.md",
              "The Engineering Contract is the shared agreement that all agents, tools, workflows, and generated code must follow.",
              "A product or repository Engineering Contract is the shared implementation and policy agreement that its agents, tools, workflows, and generated code must follow within that product or repository scope.",
          )
          replace(
              "docs/engineering-contract.md",
              "No agent should make random technical decisions outside the Engineering Contract.",
              "No agent should make random technical decisions outside the applicable product or repository Engineering Contract.",
          )

          # Ports and adapters remains a pattern; final taxonomy belongs to #7.
          replace(
              "docs/ports-and-adapters.md",
              "# Native AI Ports and Adapters Architecture\n\n## Problem",
              "# Native AI Ports And Adapters Architecture\n\nStatus: Architecture pattern and non-exhaustive examples\n\nCanonical base meanings and ownership: [`domain-model/README.md`](domain-model/README.md)\n\nFinal port kinds, adapter taxonomy, and first-class port contracts: issue `#7`\n\n## Problem",
          )
          replace(
              "docs/ports-and-adapters.md",
              "## Native AI Framework Core\n\nThe stable framework core includes:",
              "## Stable Framework Concerns\n\nThe following is an operational concern list, not a bounded-context map or exhaustive domain model:",
          )
          replace(
              "docs/ports-and-adapters.md",
              "Example ports:",
              "Non-exhaustive example ports:",
          )
          replace(
              "docs/ports-and-adapters.md",
              "An adapter implements a port.",
              "An adapter implements or translates a port or contract while preserving upstream meaning and boundary. The exhaustive subtype taxonomy remains owned by issue `#7`.",
          )

          # Development Loop keeps active contract semantics and explicitly records legacy terminology.
          replace(
              "docs/development-loop.md",
              "# Development Loop — Agent-Driven Execution Cycle\n\n## What It Is",
              "# Development Loop — Agent-Driven Execution Cycle\n\nStatus: Reusable execution method governed by `contracts/runtime/development-loop.contract.yaml`\n\nCanonical domain lifecycle and typed status semantics: [`domain-model/lifecycle-and-status.md`](domain-model/lifecycle-and-status.md)\n\nVersioned correction of legacy review/approval and documentation-shortcut wording: issue `#26`\n\n## What It Is",
          )
          replace(
              "docs/development-loop.md",
              "The development loop is the canonical execution cycle for Agent-Driven Development. It defines the phases an agent follows when performing work, the gates between them, and the allowed transitions.",
              "The development loop is the reusable execution cycle for Agent-Driven Development. It defines phases, gates, and transitions for performing engineering work. It is not the canonical domain lifecycle and does not replace product or capability workflows.",
          )
          replace(
              "docs/development-loop.md",
              "**Exit gate:** Review verdict is APPROVE or CHANGES_REQUESTED.",
              "**Exit gate (current `1.0.0` contract wording):** Review verdict is `APPROVE` or `CHANGES_REQUESTED`.\n\n**Canonical interpretation:** `APPROVE` here is a legacy positive review disposition, not authority-bearing domain `Approval`. Required approval remains a separate governance decision. Issue `#26` owns the versioned contract correction.",
          )
          replace(
              "docs/development-loop.md",
              "Shortcuts must be declared — agents cannot silently skip phases.",
              "Shortcuts must be declared — agents cannot silently skip phases. A declared shortcut does not waive applicable repository policy, relative-link or rendering checks, contradiction review, security review, or authority-bearing approval. The current documentation-only shortcut semantics are tracked for versioned correction in issue `#26`.",
          )
          replace(
              "docs/development-loop.md",
              "The development loop is **not** a workflow. It's the execution cycle within any phase of a workflow.",
              "The Development Loop is **not** a workflow or the canonical domain lifecycle. It is an execution method that may run within a workflow phase.",
          )

          # Glossary delegates domain objects to the canonical model.
          replace(
              "docs/glossary.md",
              "Canonical domain-model work: issue `#6`",
              "Canonical domain model: [`domain-model/README.md`](domain-model/README.md)",
          )
          replace(
              "docs/glossary.md",
              "For complete Native AI Engineering domain objects, aggregates, bounded contexts, and lifecycle semantics, issue `#6` remains authoritative once accepted.",
              "For complete Native AI Engineering domain objects, aggregates, bounded contexts, and lifecycle semantics, use the [canonical domain model](domain-model/README.md).",
          )
          replace(
              "docs/glossary.md",
              "accepted atomic canonical term\n→ accepted domain model or contract",
              "accepted atomic canonical term\n→ accepted canonical domain model\n→ accepted contract or port specialization",
          )
          replace(
              "docs/glossary.md",
              "Candidate philosophy definitions do not silently supersede accepted machine-readable contracts before issue `#13` is reviewed. Conflicts must be recorded and reconciled explicitly.",
              "Accepted philosophy terms and the canonical domain model do not silently rewrite machine-readable contracts. Contract migrations remain compatibility-governed and conflicts must be recorded and reconciled explicitly.",
          )
          PY

      - name: Validate documentation authority and links
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path.cwd()
          markdown_files = [root / "README.md", *sorted((root / "docs").rglob("*.md"))]
          errors = []
          pattern = re.compile(r"(?<!!)\[[^\]]+\]\(([^)]+)\)")

          for file in markdown_files:
              text = file.read_text(encoding="utf-8")
              for target in pattern.findall(text):
                  target = target.strip().split()[0].strip("<>")
                  if not target or target.startswith(("http://", "https://", "mailto:", "#")):
                      continue
                  relative = target.split("#", 1)[0].split("?", 1)[0]
                  if not relative:
                      continue
                  resolved = (file.parent / relative).resolve()
                  try:
                      resolved.relative_to(root.resolve())
                  except ValueError:
                      errors.append(f"{file.relative_to(root)}: link escapes repository: {target}")
                      continue
                  if not resolved.exists():
                      errors.append(f"{file.relative_to(root)}: missing relative target: {target}")

          stale = {
              "docs/architecture-v0.2.md": ["Canonical domain-model work: issue `#6`", "domain model owned by issue #6"],
              "docs/glossary.md": ["Canonical domain-model work: issue `#6`", "issue `#6` remains authoritative once accepted"],
          }
          for path, markers in stale.items():
              text = (root / path).read_text(encoding="utf-8")
              for marker in markers:
                  if marker in text:
                      errors.append(f"{path}: stale authority marker remains: {marker}")

          required = {
              "README.md": ["docs/domain-model/README.md"],
              "docs/architecture-v0.2.md": ["domain-model/README.md", "not a bounded-context map"],
              "docs/domain-driven-model.md": ["Status: Modeling guide", "domain-model/README.md"],
              "docs/engineering-contract.md": ["Product And Repository Engineering Contract Guide", "domain-model/README.md"],
              "docs/ports-and-adapters.md": ["issue `#7`", "domain-model/README.md"],
              "docs/development-loop.md": ["domain-model/lifecycle-and-status.md", "issue `#26`", "legacy positive review disposition"],
              "docs/glossary.md": ["domain-model/README.md", "accepted canonical domain model"],
          }
          for path, markers in required.items():
              text = (root / path).read_text(encoding="utf-8")
              for marker in markers:
                  if marker not in text:
                      errors.append(f"{path}: missing required marker: {marker}")

          if errors:
              raise SystemExit("\n".join(errors))
          print(f"validated {len(markdown_files)} markdown files")
          PY

          changed=$(git diff --name-only origin/main...HEAD)
          if printf '%s\n' "$changed" | grep -E '^(contracts/|schemas/|scripts/)'; then
            echo "Issue #6 documentation branch must not change contracts, schemas, or tooling" >&2
            exit 1
          fi
          git diff --check

      - name: Commit reconciliation
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/architecture-v0.2.md docs/domain-driven-model.md docs/engineering-contract.md docs/ports-and-adapters.md docs/development-loop.md docs/glossary.md
          git commit -m "docs: reconcile framework navigation with canonical domain model [skip ci]"
          git push origin HEAD:${HEAD_BRANCH}
