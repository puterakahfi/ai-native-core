name: Temporary port batch 2 validation

on:
  push:
    branches:
      - 7-formalize-port-taxonomy-and-first-class-port-contracts

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install validator dependencies
        run: python3 -m pip install --disable-pip-version-check pyyaml jsonschema

      - name: Compile validators and tests
        run: |
          python3 -m py_compile \
            scripts/validate-contract-identity.py \
            scripts/validate-port-contracts.py \
            scripts/validate-port-adapter-reference.py \
            tests/test_validate_port_contracts.py \
            tests/test_validate_port_adapter_reference.py

      - name: Validate canonical skill contract identity
        run: python3 scripts/validate-contract-identity.py

      - name: Validate first-class port contracts
        run: python3 scripts/validate-port-contracts.py

      - name: Validate compatible adapter port reference
        run: >-
          python3 scripts/validate-port-adapter-reference.py
          tests/fixtures/port-adapter-references/valid-model-inference.port-reference.yaml

      - name: Run port regression tests
        run: |
          python3 -m unittest discover -s tests -p 'test_validate_port_contracts.py' -v
          python3 -m unittest discover -s tests -p 'test_validate_port_adapter_reference.py' -v

      - name: Regenerate manifest
        run: ./scripts/generate-manifest.sh

      - name: Commit generated manifest when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- contracts/manifest.yaml; then
            echo 'PASS — manifest already matches the contract tree.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add contracts/manifest.yaml
          git commit -m 'chore(governance): register port migration batch 2'
          git push
