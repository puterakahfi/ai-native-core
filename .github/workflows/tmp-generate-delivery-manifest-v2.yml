name: Temporary Generate Stacked Delivery Manifest

on:
  push:
    branches:
      - 21-delivery-work-breakdown-contract-v2
    paths:
      - contracts/skills/product/delivery-work-breakdown.contract.yaml
      - contracts/tests/delivery-work-breakdown.test.yaml
      - .github/workflows/tmp-generate-delivery-manifest-v2.yml

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 21-delivery-work-breakdown-contract-v2
          fetch-depth: 0
      - name: Generate manifest
        run: |
          chmod +x scripts/generate-manifest.sh
          ./scripts/generate-manifest.sh
      - name: Remove temporary workflow
        run: rm .github/workflows/tmp-generate-delivery-manifest-v2.yml
      - name: Commit generated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contracts/manifest.yaml .github/workflows/tmp-generate-delivery-manifest-v2.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: regenerate contract manifest"
          git push origin HEAD:21-delivery-work-breakdown-contract-v2
