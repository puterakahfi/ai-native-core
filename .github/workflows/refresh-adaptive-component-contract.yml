name: Refresh adaptive component contract indexes

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/refresh-adaptive-component-contract.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update canonical references and manifest
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          readme = Path("README.md")
          text = readme.read_text()
          old = "| `adaptive-ui-patterns` | Viewport-aware component and interaction selection for mobile, tablet, and desktop |"
          new = "| `adaptive-component-design` | Cross-device component pattern selection and substitution for mobile, tablet, laptop, and desktop |"
          if old not in text:
              raise SystemExit("Expected adaptive-ui-patterns README entry was not found")
          readme.write_text(text.replace(old, new, 1))
          PY

          ./scripts/generate-manifest.sh

          test -f contracts/skills/design/adaptive-component-design.contract.yaml
          test ! -f contracts/skills/design/adaptive-ui-patterns.contract.yaml
          grep -q 'id: adaptive-component-design' contracts/manifest.yaml
          ! grep -q 'path: contracts/skills/design/adaptive-ui-patterns.contract.yaml' contracts/manifest.yaml
          grep -q '`adaptive-component-design`' README.md

          rm .github/workflows/refresh-adaptive-component-contract.yml

      - name: Commit refreshed indexes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md contracts/manifest.yaml .github/workflows/refresh-adaptive-component-contract.yml
          git diff --cached --check
          git commit -m "chore: finalize adaptive component contract migration"
          git push
