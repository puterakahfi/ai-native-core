name: Temporary Generate Delivery Manifest

on:
  push:
    branches:
      - 21-delivery-work-breakdown-contract
    paths:
      - contracts/skills/product/delivery-work-breakdown.contract.yaml
      - contracts/tests/delivery-work-breakdown.test.yaml
      - .github/workflows/tmp-generate-delivery-manifest.yml

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: 21-delivery-work-breakdown-contract
          fetch-depth: 0

      - name: Generate canonical manifest
        run: |
          chmod +x scripts/generate-manifest.sh
          ./scripts/generate-manifest.sh

      - name: Remove temporary workflow
        run: rm .github/workflows/tmp-generate-delivery-manifest.yml

      - name: Commit generated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contracts/manifest.yaml .github/workflows/tmp-generate-delivery-manifest.yml
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "chore: regenerate contract manifest"
          git push origin HEAD:21-delivery-work-breakdown-contract
