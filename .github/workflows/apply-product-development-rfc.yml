name: Apply Product Development RFC

on:
  push:
    branches:
      - feat/80-product-development-12-phases

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/80-product-development-12-phases
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - name: Apply canonical contract migration
        run: python scripts/apply_product_development_0_4.py
      - name: Remove one-time migration resources
        run: |
          rm scripts/apply_product_development_0_4.py
          rm .github/workflows/apply-product-development-rfc.yml
      - name: Commit migrated contract
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add contracts/workflows/product-development.contract.yaml scripts/apply_product_development_0_4.py .github/workflows/apply-product-development-rfc.yml
          git commit -m "feat: expand product-development contract to 12 phases"
          git push origin HEAD:feat/80-product-development-12-phases
