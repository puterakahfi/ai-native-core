name: Regenerate task continuity discovery

on:
  push:
    branches:
      - 48-task-continuity-contract
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: 48-task-continuity-contract

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check PyYAML jsonschema

      - name: Regenerate discovery report
        run: python3 scripts/inventory-contract-schemas.py

      - name: Commit report and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/regenerate-task-continuity-discovery.yml
          git add docs/contract-schema-discovery.yaml
          git commit -m "chore(contracts): refresh schema discovery for task continuity (#48)"
          git push origin HEAD:48-task-continuity-contract
