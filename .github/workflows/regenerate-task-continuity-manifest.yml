name: Regenerate task continuity manifest

on:
  push:
    branches:
      - 48-task-continuity-contract

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: 48-task-continuity-contract

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check PyYAML jsonschema

      - name: Regenerate manifest
        run: ./scripts/generate-manifest.sh

      - name: Commit generated manifest and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/regenerate-task-continuity-manifest.yml
          git add contracts/manifest.yaml
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "chore(contracts): regenerate manifest for task continuity (#48)"
          git push origin HEAD:48-task-continuity-contract
