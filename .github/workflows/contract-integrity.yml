name: Contract integrity

on:
  pull_request:
    paths:
      - contracts/**
      - schemas/port-contract.schema.yaml
      - scripts/generate-manifest.sh
      - scripts/validate-contract-identity.py
      - scripts/validate-port-contracts.py
      - scripts/validate-port-adapter-reference.py
      - tests/test_validate_port_contracts.py
      - tests/test_validate_port_adapter_reference.py
      - tests/fixtures/port-contracts/**
      - tests/fixtures/port-adapter-references/**
      - .github/workflows/contract-integrity.yml
  push:
    branches: [main]
    paths:
      - contracts/**
      - schemas/port-contract.schema.yaml
      - scripts/generate-manifest.sh
      - scripts/validate-contract-identity.py
      - scripts/validate-port-contracts.py
      - scripts/validate-port-adapter-reference.py
      - tests/test_validate_port_contracts.py
      - tests/test_validate_port_adapter_reference.py
      - tests/fixtures/port-contracts/**
      - tests/fixtures/port-adapter-references/**
      - .github/workflows/contract-integrity.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install validator dependencies
        run: python3 -m pip install --disable-pip-version-check pyyaml jsonschema

      - name: Compile validators and port tests
        run: |
          python3 -m py_compile \
            scripts/validate-contract-identity.py \
            scripts/validate-port-contracts.py \
            scripts/validate-port-adapter-reference.py \
            tests/test_validate_port_contracts.py \
            tests/test_validate_port_adapter_reference.py

      - name: Validate canonical skill contract identity
        run: python3 scripts/validate-contract-identity.py

      - name: Validate first-class port contracts
        run: python3 scripts/validate-port-contracts.py

      - name: Validate adapter port reference fixture
        run: >-
          python3 scripts/validate-port-adapter-reference.py
          tests/fixtures/port-adapter-references/valid-model-inference.port-reference.yaml

      - name: Run port contract regression tests
        run: python3 -m unittest discover -s tests -p 'test_validate_port_contracts.py' -v

      - name: Run adapter port reference regression tests
        run: python3 -m unittest discover -s tests -p 'test_validate_port_adapter_reference.py' -v

      - name: Regenerate contract manifest
        run: ./scripts/generate-manifest.sh

      - name: Verify generated manifest is current on pull requests
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --exit-code -- contracts/manifest.yaml; then
            echo 'contracts/manifest.yaml is stale. Run ./scripts/generate-manifest.sh and commit it.'
            exit 1
          fi
          echo 'PASS — contracts/manifest.yaml matches the contract tree.'

      - name: Commit regenerated manifest on direct main changes
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- contracts/manifest.yaml; then
            echo 'PASS — contracts/manifest.yaml already matches the contract tree.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add contracts/manifest.yaml
          git commit -m 'chore(governance): sync contract manifest'
          git push
