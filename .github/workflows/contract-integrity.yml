name: Contract integrity

on:
  pull_request:
    paths:
      - contracts/**
      - docs/contract-schema-discovery.yaml
      - .github/workflows/contract-integrity.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Install validator dependencies
        run: python3 -m pip install --disable-pip-version-check pyyaml jsonschema
      - name: Regenerate metadata
        shell: bash
        run: |
          ./scripts/generate-manifest.sh || true
          python3 scripts/inventory-contract-schemas.py
      - name: Commit generated artifacts
        shell: bash
        run: |
          git add contracts/manifest.yaml docs/contract-schema-discovery.yaml
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '4189828+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(governance): sync software testing contract metadata'
          git push origin "HEAD:${{ github.head_ref }}"
