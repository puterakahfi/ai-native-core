name: Contract integrity

on:
  pull_request:
    paths:
      - contracts/**
      - docs/contract-schema-discovery.yaml
      - schema-diagnostic.txt
      - .github/workflows/contract-integrity.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Install validator dependencies
        run: python3 -m pip install --disable-pip-version-check pyyaml jsonschema
      - name: Capture schema diagnostic
        shell: bash
        run: |
          set +e
          ./scripts/generate-manifest.sh > schema-diagnostic.txt 2>&1
          echo "manifest_status=$?" >> schema-diagnostic.txt
          python3 scripts/inventory-contract-schemas.py >> schema-diagnostic.txt 2>&1
          echo "inventory_status=$?" >> schema-diagnostic.txt
          python3 scripts/validate-contract-schemas.py >> schema-diagnostic.txt 2>&1
          echo "schema_status=$?" >> schema-diagnostic.txt
          set -e
      - name: Commit diagnostic
        shell: bash
        run: |
          git add schema-diagnostic.txt contracts/manifest.yaml docs/contract-schema-discovery.yaml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(debug): capture software testing schema failure'
          git push origin "HEAD:${{ github.head_ref }}"
