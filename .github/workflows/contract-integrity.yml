name: Contract integrity

on:
  pull_request:
    paths:
      - contracts/**
      - docs/contract-schema-discovery.yaml
      - generator-diagnostic.txt
      - .github/workflows/contract-integrity.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Install validator dependencies
        run: python3 -m pip install --disable-pip-version-check pyyaml jsonschema
      - name: Capture generator diagnostic
        shell: bash
        run: |
          set +e
          ./scripts/generate-manifest.sh > generator-diagnostic.txt 2>&1
          echo "generator_status=$?" >> generator-diagnostic.txt
          python3 scripts/inventory-contract-schemas.py >> generator-diagnostic.txt 2>&1
          echo "inventory_status=$?" >> generator-diagnostic.txt
          set -e
      - name: Commit diagnostic
        shell: bash
        run: |
          git add generator-diagnostic.txt contracts/manifest.yaml docs/contract-schema-discovery.yaml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(debug): capture software testing contract generator failure'
          git push origin "HEAD:${{ github.head_ref }}"
