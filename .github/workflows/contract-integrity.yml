name: Contract integrity

on:
  pull_request:
    paths:
      - README.md
      - CONTRIBUTING.md
      - contracts/**
      - docs/contract-catalog.md
      - docs/contract-schema-*.md
      - docs/contract-schema-discovery.yaml
      - docs/workflow-contract-migration.yaml
      - docs/port-inventory.yaml
      - schemas/**
      - scripts/contract_resolution.py
      - scripts/generate-manifest.py
      - scripts/generate-manifest.sh
      - scripts/inventory-contract-schemas.py
      - scripts/schema_validation.py
      - scripts/validate-contract-identity.py
      - scripts/validate-contract-schemas.py
      - scripts/validate-port-contracts.py
      - scripts/validate-port-adapter-reference.py
      - scripts/run-eval.py
      - tests/test_validate_contract_schemas.py
      - tests/test_contract_resolution.py
      - tests/test_validate_port_contracts.py
      - tests/test_validate_port_adapter_reference.py
      - tests/test_port_inventory.py
      - tests/fixtures/contract-schemas/**
      - tests/fixtures/port-contracts/**
      - tests/fixtures/port-adapter-references/**
      - .github/workflows/contract-integrity.yml
  push:
    branches: [main]
    paths:
      - README.md
      - CONTRIBUTING.md
      - contracts/**
      - docs/contract-catalog.md
      - docs/contract-schema-*.md
      - docs/contract-schema-discovery.yaml
      - docs/workflow-contract-migration.yaml
      - docs/port-inventory.yaml
      - schemas/**
      - scripts/contract_resolution.py
      - scripts/generate-manifest.py
      - scripts/generate-manifest.sh
      - scripts/inventory-contract-schemas.py
      - scripts/schema_validation.py
      - scripts/validate-contract-identity.py
      - scripts/validate-contract-schemas.py
      - scripts/validate-port-contracts.py
      - scripts/validate-port-adapter-reference.py
      - scripts/run-eval.py
      - tests/test_validate_contract_schemas.py
      - tests/test_contract_resolution.py
      - tests/test_validate_port_contracts.py
      - tests/test_validate_port_adapter_reference.py
      - tests/test_port_inventory.py
      - tests/fixtures/contract-schemas/**
      - tests/fixtures/port-contracts/**
      - tests/fixtures/port-adapter-references/**
      - .github/workflows/contract-integrity.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install validator dependencies
        run: python3 -m pip install --disable-pip-version-check pyyaml jsonschema

      - name: Compile schema, manifest, compatibility, and regression tooling
        run: |
          python3 -m py_compile \
            scripts/contract_resolution.py \
            scripts/generate-manifest.py \
            scripts/inventory-contract-schemas.py \
            scripts/schema_validation.py \
            scripts/validate-contract-identity.py \
            scripts/validate-contract-schemas.py \
            scripts/validate-port-contracts.py \
            scripts/validate-port-adapter-reference.py \
            scripts/run-eval.py \
            tests/test_validate_contract_schemas.py \
            tests/test_contract_resolution.py \
            tests/test_validate_port_contracts.py \
            tests/test_validate_port_adapter_reference.py \
            tests/test_port_inventory.py

      - name: Regenerate schema-aware contract manifest
        run: ./scripts/generate-manifest.sh

      - name: Validate unified contract schemas and manifest parity
        run: python3 scripts/validate-contract-schemas.py

      - name: Validate cross-family contract identity and migration aliases
        run: python3 scripts/validate-contract-identity.py

      - name: Validate first-class port semantics
        run: python3 scripts/validate-port-contracts.py

      - name: Validate adapter port reference fixture
        run: >-
          python3 scripts/validate-port-adapter-reference.py
          tests/fixtures/port-adapter-references/valid-model-inference.port-reference.yaml

      - name: Validate behavioral test contracts
        run: python3 scripts/run-eval.py --all --validate-tests

      - name: Run unified contract schema regressions
        run: python3 -m unittest discover -s tests -p 'test_validate_contract_schemas.py' -v

      - name: Run contract resolution regressions
        run: python3 -m unittest discover -s tests -p 'test_contract_resolution.py' -v

      - name: Run port contract regressions
        run: python3 -m unittest discover -s tests -p 'test_validate_port_contracts.py' -v

      - name: Run port inventory regressions
        run: python3 -m unittest discover -s tests -p 'test_port_inventory.py' -v

      - name: Run adapter port reference regressions
        run: python3 -m unittest discover -s tests -p 'test_validate_port_adapter_reference.py' -v

      - name: Verify schema discovery report is current
        run: python3 scripts/inventory-contract-schemas.py --check

      - name: Verify generated artifacts are current on pull requests
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --exit-code -- contracts/manifest.yaml docs/contract-schema-discovery.yaml; then
            echo 'Generated contract metadata is stale. Regenerate the manifest and schema discovery report.'
            exit 1
          fi
          echo 'PASS — generated manifest and schema discovery report match the contract tree.'

      - name: Commit regenerated artifacts on direct main changes
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- contracts/manifest.yaml docs/contract-schema-discovery.yaml; then
            echo 'PASS — generated contract metadata already matches the contract tree.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add contracts/manifest.yaml docs/contract-schema-discovery.yaml
          git commit -m 'chore(governance): sync contract metadata'
          git push
