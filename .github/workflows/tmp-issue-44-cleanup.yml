name: Temporary issue 44 cleanup

on:
  pull_request:
    branches: [main]
    paths:
      - .tmp/**
      - .gitignore
      - .github/workflows/tmp-issue-44-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout issue branch
        uses: actions/checkout@v4
        with:
          ref: 44-refine-composition-visual-hierarchy-contracts
          fetch-depth: 0

      - name: Remove temporary artifacts and cleanup workflow
        run: |
          set -euo pipefail
          git rm -r --ignore-unmatch .tmp
          rm -f .github/workflows/tmp-issue-44-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(design): remove temporary issue 44 artifacts'
          git push origin HEAD:44-refine-composition-visual-hierarchy-contracts
