contract_schema:
  kind: workflow_contract
  version: "1.0.0"
  path: schemas/workflow-contract.schema.yaml
workflow_contract:
  id: fixture-workflow
  type: workflow
  version: "1.0.0"
  category: engineering
  workflow_kind: engineering_lifecycle
  purpose: Coordinate one fixture lifecycle with explicit phases and evidence gates.
  phases:
    - id: prepare
      order: 1
      purpose: Prepare attributable fixture inputs.
    - id: verify
      order: 2
      purpose: Verify the fixture result.
  transitions:
    - from: prepare
      to: verify
      condition: Required fixture inputs are available.
  skill_load_order:
    - phase: prepare
      load:
        - fixture-skill
  quality_gates:
    - fixture_inputs_are_attributable
  adapter_requirements:
    must_preserve_phase_order: true
