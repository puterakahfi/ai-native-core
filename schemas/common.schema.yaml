$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://native-ai.engineering/schemas/common.schema.yaml"
title: Native AI Engineering Shared Contract Primitives
type: object
$defs:
  non_empty_string:
    type: string
    minLength: 1
  contract_id:
    type: string
    pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
  machine_id:
    type: string
    pattern: "^[a-z][a-z0-9]*(?:_[a-z0-9]+)*$"
  semantic_version:
    type: string
    pattern: "^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)(?:-[0-9A-Za-z.-]+)?$"
  schema_path:
    type: string
    pattern: "^schemas/[a-z0-9]+(?:-[a-z0-9]+)*\\.schema\\.yaml$"
  contract_path:
    type: string
    pattern: "^contracts/.+\\.(?:contract|port|test)\\.yaml$"
  schema_kind:
    type: string
    enum:
      - skill_contract
      - workflow_contract
      - runtime_contract
      - port_contract
      - behavioral_test_contract
      - adapter_manifest
      - compatibility_manifest
      - domain_contract
      - contract_manifest
  contract_schema_identity:
    type: object
    additionalProperties: false
    required:
      - kind
      - version
      - path
    properties:
      kind:
        $ref: "#/$defs/schema_kind"
      version:
        $ref: "#/$defs/semantic_version"
      path:
        $ref: "#/$defs/schema_path"
  string_list:
    type: array
    items:
      $ref: "#/$defs/non_empty_string"
  unique_string_list:
    type: array
    uniqueItems: true
    items:
      $ref: "#/$defs/non_empty_string"
  non_empty_unique_string_list:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      $ref: "#/$defs/non_empty_string"
  machine_id_list:
    type: array
    uniqueItems: true
    items:
      $ref: "#/$defs/machine_id"
  non_empty_machine_id_list:
    type: array
    minItems: 1
    uniqueItems: true
    items:
      $ref: "#/$defs/machine_id"
  roles:
    type: array
    uniqueItems: true
    items:
      $ref: "#/$defs/machine_id"
  inputs:
    type: object
    additionalProperties: true
    properties:
      required:
        $ref: "#/$defs/unique_string_list"
      optional:
        $ref: "#/$defs/unique_string_list"
      definitions:
        type: object
  outputs:
    type: object
    additionalProperties: true
    properties:
      required:
        $ref: "#/$defs/unique_string_list"
      allowed:
        $ref: "#/$defs/unique_string_list"
  skill_boundary:
    type: object
    additionalProperties: true
    properties:
      covers:
        $ref: "#/$defs/unique_string_list"
      does_not_cover:
        $ref: "#/$defs/unique_string_list"
  quality_gates:
    $ref: "#/$defs/non_empty_unique_string_list"
  adapter_requirements:
    type: object
    minProperties: 1
  phase_skills:
    type: object
    additionalProperties: false
    properties:
      required:
        $ref: "#/$defs/unique_string_list"
      optional:
        $ref: "#/$defs/unique_string_list"
  workflow_phase:
    type: object
    additionalProperties: true
    required:
      - id
      - order
    properties:
      id:
        $ref: "#/$defs/machine_id"
      order:
        type: integer
        minimum: 1
      purpose:
        $ref: "#/$defs/non_empty_string"
      description:
        $ref: "#/$defs/non_empty_string"
      optional:
        type: boolean
      gate:
        $ref: "#/$defs/machine_id"
      skills:
        $ref: "#/$defs/phase_skills"
      outputs:
        $ref: "#/$defs/unique_string_list"
    anyOf:
      - required: [purpose]
      - required: [description]
  workflow_transition:
    type: object
    additionalProperties: true
    required:
      - from
      - to
    properties:
      from:
        $ref: "#/$defs/machine_id"
      to:
        $ref: "#/$defs/machine_id"
      condition:
        $ref: "#/$defs/non_empty_string"
      when:
        $ref: "#/$defs/non_empty_string"
      note:
        $ref: "#/$defs/non_empty_string"
  skill_load_entry:
    type: object
    additionalProperties: false
    required:
      - phase
      - load
    properties:
      phase:
        $ref: "#/$defs/machine_id"
      load:
        $ref: "#/$defs/unique_string_list"
  compatibility_alias:
    type: object
    additionalProperties: false
    required:
      - from_path
      - to_path
      - contract_id
      - contract_kind
      - version_constraint
      - status
    properties:
      from_path:
        $ref: "#/$defs/contract_path"
      to_path:
        $ref: "#/$defs/contract_path"
      contract_id:
        $ref: "#/$defs/contract_id"
      contract_kind:
        $ref: "#/$defs/schema_kind"
      version_constraint:
        type: string
        pattern: "^(?:\\^|~)?[0-9]+\\.[0-9]+(?:\\.[0-9]+)?(?:-[0-9A-Za-z.-]+)?$"
      status:
        type: string
        enum: [active, deprecated, retired]
      rationale:
        $ref: "#/$defs/non_empty_string"
